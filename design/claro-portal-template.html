/* ---------- Topic Sprint · app/(student)/student/sprint/page.tsx --------- */
const SPRINT_TYPES = [
  { value: 'mc', label: 'Multiple choice', desc: 'Choose from four options.', icon: 'list' },
  { value: 'short', label: 'Short answer', desc: 'Practise written answers.', icon: 'pen-line' },
  { value: 'mixed', label: 'Mixed', desc: 'Multiple choice, then short answers.', icon: 'layers' },
];
const QUICK_STARTS = [
  { id: 'weak', icon: 'target', title: 'Weak spot: Fiscal policy', meta: 'Mixed · 12 marks · 15 min' },
  { id: 'same', icon: 'rotate-ccw', title: 'Same as last time', meta: 'Mixed · 25 marks · 2 topics' },
  { id: 'section1', icon: 'list', title: 'Section I drill', meta: '20 multiple choice · 20 min' },
];
const YEARS = Array.from({ length: 16 }, (_, i) => 2011 + i);
const poolFor = (s, type) => (type !== 'short' ? s.mc : 0) + (type !== 'mc' ? s.sa : 0);

function builderSummary(b = state.builder) {
  const marks = b.marks === 'custom' ? clamp(Number(b.custom) || 0, 5, 100) : b.marks;
  let mcMarks = 0; let saMarks = 0;
  if (b.type === 'mc') mcMarks = marks; else if (b.type === 'short') saMarks = marks; else { mcMarks = Math.round(marks * 0.52); saMarks = marks - mcMarks; }
  const saQuestions = saMarks ? Math.max(1, Math.round(saMarks / 4)) : 0;
  const minutes = Math.round(mcMarks * 1 + saMarks * 1.5);   // 1 min per MC, 1.5 min per written mark
  const years = (b.to - b.from + 1) / YEARS.length;
  let match = 0; let fresh = 0;
  for (const id of b.subs) {
    const s = DEMO.subById[id]; const pool = poolFor(s, b.type);
    match += Math.round(pool * years);
    fresh += Math.round(s.fresh * (pool / (s.mc + s.sa)) * years);
  }
  return { marks, mcMarks, saMarks, saQuestions, minutes, match, fresh };
}

function SprintBuilderPage() {
  const b = state.builder;
  const s = builderSummary();
  const section = (title, desc, body, extra = '') => html`<div class="grid gap-3.5 px-5 py-5 sm:px-6"><div class="flex items-end justify-between gap-3"><div><h3 class="text-sm font-semibold">${title}</h3>${desc ? html`<p class="mt-0.5 text-[13px] text-muted-foreground">${desc}</p>` : ''}</div>${extra}</div>${body}</div>`;
  return html`${PageHeader({ title: 'Topic Sprint', description: 'Build exactly the practice you need. The summary shows what you’ll get.' })}
  ${UnfinishedSprintBanner()}
  <div class="mb-5 grid gap-3 md:grid-cols-3">${QUICK_STARTS.map((q) => html`<button type="button" data-action="quick-start" data-value="${q.id}" class="group flex items-center gap-3 rounded-xl border bg-card p-3.5 text-left shadow-xs transition-colors hover:border-foreground/20 hover:bg-accent">
    <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-muted">${Icon(q.icon, 'size-4')}</span>
    <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold">${q.title}</span><span class="block truncate text-xs text-muted-foreground">${q.meta}</span></span>
    ${Icon('arrow-right', 'size-4 shrink-0 text-muted-foreground transition-transform group-hover:translate-x-0.5')}
  </button>`)}</div>
  <div class="grid grid-cols-12 items-start gap-4 xl:gap-5">
    <section data-slot="card" data-component="SprintBuilder" class="col-span-12 gap-0 divide-y py-0 xl:col-span-8">
      ${section('Question type', null, html`<div class="grid gap-3 sm:grid-cols-3" role="radiogroup" aria-label="Question type">${SPRINT_TYPES.map((t) => html`<button type="button" data-slot="option-card" role="radio" aria-checked="${String(b.type === t.value)}" data-state="${b.type === t.value ? 'on' : 'off'}" data-action="b-type" data-value="${t.value}" data-key="b-type-${t.value}"><span class="option-dot"></span>${Icon(t.icon, 'mb-2 size-5 text-muted-foreground')}<span class="text-sm font-semibold">${t.label}</span><span class="text-[13px] text-muted-foreground">${t.desc}</span></button>`)}</div>`)}
      ${section('Topics', 'Pick whole topics or single dot points.', html`<div class="grid gap-3">${DEMO.topics.map((t) => {
        const sel = t.subs.filter((x) => b.subs.includes(x.id)).length;
        const st = sel === 0 ? 'off' : sel === t.subs.length ? 'on' : 'indeterminate';
        return html`<div class="rounded-xl border p-3.5">
          <button type="button" data-action="b-topic" data-value="${t.id}" data-key="b-topic-${t.id}" class="flex w-full items-center gap-3 rounded-md text-left" aria-pressed="${String(st === 'on')}">${Checkbox({ state: st })}<span class="min-w-0 flex-1 truncate text-sm font-semibold">${t.name}</span><span class="text-xs text-muted-foreground tabular">${sel} of ${t.subs.length}</span></button>
          <div class="mt-3 flex flex-wrap gap-2 sm:pl-7">${t.subs.map((x) => Chip({ label: x.short || x.name, on: b.subs.includes(x.id), action: 'b-sub', value: x.id, count: poolFor(x, b.type) }))}</div>
        </div>`;
      })}</div>`, b.subs.length ? Button({ label: 'Clear', variant: 'ghost', size: 'sm', 'data-action': 'b-clear-subs' }) : '')}
      ${section('Size', b.type === 'mixed' ? `${s.mcMarks} multiple choice, then ${s.saMarks} marks of short answers.` : b.type === 'mc' ? `${s.mcMarks} multiple choice questions.` : `${s.saMarks} marks of short answers, about ${plural(s.saQuestions, 'question')}.`, html`<div class="flex flex-wrap items-center gap-2">
        ${[10, 25, 40, 60].map((m) => Chip({ label: `${m} marks`, on: b.marks === m, action: 'b-marks', value: m }))}
        ${Chip({ label: 'Custom', on: b.marks === 'custom', action: 'b-marks', value: 'custom' })}
        ${b.marks === 'custom' ? html`<span class="flex items-center gap-2"><input data-slot="input" type="number" min="5" max="100" step="1" data-input="b-custom" data-key="b-custom" value="${b.custom}" class="h-8 w-20 tabular" aria-label="Custom marks"><span class="text-[13px] text-muted-foreground">marks</span></span>` : ''}
      </div>`)}
      ${section('Paper years', 'Keep the full range, or narrow it to recent papers.', html`<div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2">${Select({ options: YEARS.map((y) => ({ value: String(y), label: String(y) })), value: String(b.from), change: 'b-from', label: 'From year', cls: 'w-28' })}<span class="text-[13px] text-muted-foreground">to</span>${Select({ options: YEARS.map((y) => ({ value: String(y), label: String(y) })), value: String(b.to), change: 'b-to', label: 'To year', cls: 'w-28' })}</div>
        <label class="ml-auto flex cursor-pointer items-center gap-2.5 text-[13px] font-medium">${Switch({ on: b.preferNew, action: 'b-prefer', label: 'Prefer questions I haven’t seen' })}Prefer questions I haven’t seen</label>
      </div>`)}
      ${section('Timer and feedback', null, html`<div class="grid gap-4 sm:grid-cols-2">
        <div class="flex items-start gap-3 rounded-xl border p-3.5">${Switch({ on: b.timed, action: 'b-timed', label: 'Timed at exam pace' })}<div><p class="text-sm font-medium">Timed at exam pace</p><p class="text-[13px] text-muted-foreground">${b.timed ? `${s.minutes} minutes for this sprint` : 'No clock. Take your time.'}</p></div></div>
        <div class="grid gap-2 rounded-xl border p-3.5"><p class="text-sm font-medium">Show feedback</p>${ToggleGroup({ items: [{ value: 'end', label: 'At the end' }, { value: 'each', label: 'After each question' }], value: b.feedback, action: 'b-feedback', label: 'When to show feedback' })}</div>
      </div>`)}
    </section>
    <div class="col-span-12 xl:sticky xl:top-20 xl:col-span-4">${SprintSummary(s)}</div>
  </div>`;
}

        ${row('Feedback', b.feedback === 'end' ? 'At the end' : 'After each question')}

      <div class="rounded-xl bg-muted p-3.5">

/* ---------- Flashcards · app/(student)/student/flashcards/page.tsx ------- */
function deckCount(d = state.deck) {
  const f = DEMO.flash;
  let pool = d.cardType === 'terms' ? f.terms : d.cardType === 'stats' ? f.stats : f.total;
  if (d.source === 'mine') pool = 0;
  if (d.topics.length) pool = Math.round(pool * (d.topics.length / DEMO.topics.length));
  const size = d.size === 'all' ? pool : d.size === 'custom' ? clamp(Number(d.custom) || 0, 1, 200) : d.size;
  return { pool, size: Math.min(size, pool) };
}

const pctOf = (a) => (a.score != null ? pct(a.score, a.of) : a.knew != null ? pct(a.knew, a.of) : null);
function filteredActivity() {
  const f = state.act; const q = f.q.trim().toLowerCase();

    && (state.unfinished || a.status !== 'unfinished')
    && (state.flashUnfinished || a.status !== 'in-progress')
    && (f.status === 'any' || a.status === f.status || (f.status === 'marked' && ['marked', 'done'].includes(a.status)))
    && (f.topic === 'all' || a.topic === f.topic)
    && (f.date === 'all' || daysBetween(a.when, NOW) < { today: 1, '7': 7, '30': 30 }[f.date])
    && (!q || `${a.title} ${a.sub}`.toLowerCase().includes(q)));
  const by = { newest: (a, b) => b.when - a.when, oldest: (a, b) => a.when - b.when, high: (a, b) => (pctOf(b) ?? -1) - (pctOf(a) ?? -1), low: (a, b) => (pctOf(a) ?? 101) - (pctOf(b) ?? 101) }[f.sort];
  return rows.sort(by);
}

      ${Select({ options: [{ value: 'newest', label: 'Newest first' }, { value: 'oldest', label: 'Oldest first' }, { value: 'high', label: 'Highest score' }, { value: 'low', label: 'Lowest score' }], value: f.sort, change: 'act-sort', label: 'Sort', cls: 'w-40 sm:ml-auto' })}
      ${filtered ? Button({ label: 'Clear', icon: 'x', variant: 'ghost', size: 'sm', 'data-action': 'act-clear' }) : ''}
    </div>
    ${rows.length ? html`<div class="relative overflow-x-auto"><table data-slot="table">

/* ==========================================================================
   SESSIONS — focus mode (no sidebar) + results.
   Sprint:     app/(student)/student/sprint/[id]/page.tsx
   Flashcards: app/(student)/student/flashcards/[id]/page.tsx
   Results:    app/(student)/student/sprint/[id]/results/page.tsx
   ========================================================================== */
const LETTERS = ['A', 'B', 'C', 'D'];
const isAnswered = (q) => { const a = state.sp.answers[q.n]; return q.type === 'mc' ? a != null : !!(a && a.trim()); };
const answeredCount = () => DEMO.sprint.questions.filter(isAnswered).length;

/* ---------- Sprint session ------------------------------------------------- */
function SprintSessionPage() {
  const sp = state.sp; const qs = DEMO.sprint.questions; const q = qs[sp.i]; const n = answeredCount();
  return html`<div class="flex min-h-svh flex-col">
    ${FocusBar({
      title: `${DEMO.sprint.title} · ${DEMO.sprint.topicsLabel}`,
      meta: html`Question ${sp.i + 1} of ${qs.length} · ${n} answered · <span class="inline-flex items-center gap-1">${Icon('check', 'size-3')}Saved</span>`,
      progress: (n / qs.length) * 100,
      right: html`${IconButton({ icon: 'book-open', label: sp.booklet ? 'Hide booklet' : 'Show booklet', 'data-action': 'sp-booklet', 'aria-pressed': String(sp.booklet), cls: 'hidden md:inline-flex', 'data-key': 'sp-booklet' })}
        ${IconButton({ icon: 'calculator', label: 'Calculator', 'data-action': 'open-menu', 'data-value': 'calc' })}
        <span data-component="Timer" class="${cx('mx-1 inline-flex h-8 items-center gap-1.5 rounded-full border px-3 font-mono text-[13px] tabular', sp.left < 300 ? 'border-transparent bg-warning-soft text-warning-text' : 'bg-card')}" role="timer" aria-label="Time left">${Icon('timer', 'size-3.5')}<span id="sp-time">${fmtClock(sp.left)}</span></span>
        ${IconButton({ icon: 'flag', label: 'Report a problem with this question', 'data-action': 'report', cls: 'hidden sm:inline-flex' })}
        ${Button({ label: 'Finish', size: 'sm', 'data-action': 'sp-finish', cls: 'ml-1' })}`,
    })}
    <div class="flex flex-1">
      ${sp.booklet ? Booklet() : ''}
      <main class="min-w-0 flex-1 px-4 py-6 sm:px-8 sm:py-10"><div class="mx-auto max-w-[760px]">
        ${QuestionView(q)}
        <div class="mt-5 flex items-center justify-between gap-3">
          ${Button({ label: 'Previous', icon: 'arrow-left', variant: 'outline', 'data-action': 'sp-prev', disabled: sp.i === 0, 'data-key': 'sp-prev' })}
          <span class="text-[13px] text-muted-foreground tabular md:hidden">${sp.i + 1} / ${qs.length}</span>
          ${sp.i < qs.length - 1 ? Button({ label: 'Next question', iconRight: 'arrow-right', 'data-action': 'sp-next', 'data-key': 'sp-next' }) : Button({ label: 'Review and finish', iconRight: 'check', 'data-action': 'sp-finish', 'data-key': 'sp-next' })}
        </div>
      </div></main>
    </div>
  </div>`;
}

function Booklet() {
  const sp = state.sp; const qs = DEMO.sprint.questions;
  const show = (q) => sp.filter === 'all' || (sp.filter === 'unanswered' && !isAnswered(q)) || (sp.filter === 'flagged' && sp.flagged.includes(q.n));
  const chip = (q, i) => {
    const cur = i === sp.i; const ans = isAnswered(q); const fl = sp.flagged.includes(q.n);
    return html`<button type="button" data-action="sp-jump" data-value="${i}" data-key="bk-${i}" aria-label="Question ${q.n}${ans ? ', answered' : ''}${fl ? ', flagged' : ''}"${attrs({ 'aria-current': cur ? 'step' : null })} class="${cx('relative grid size-9 place-items-center rounded-full text-[13px] font-semibold tabular transition-[background-color,opacity,box-shadow]', ans ? 'bg-primary text-primary-foreground' : 'border bg-card hover:bg-accent', cur && 'ring-2 ring-brand ring-offset-2 ring-offset-card', !show(q) && 'opacity-25')}">${q.n}${fl ? html`<span class="absolute -top-0.5 -right-0.5 size-2.5 rounded-full border-2 border-card bg-brand"></span>` : ''}</button>`;
  };
  const legend = [['bg-primary', 'Answered'], ['border border-foreground/30 bg-card', 'Not answered'], ['bg-brand size-2 border-0', 'Flagged'], ['ring-2 ring-brand ring-offset-1 ring-offset-card bg-card', 'Current']];
  return html`<aside data-component="Booklet" class="scroll-thin sticky top-[67px] hidden h-[calc(100svh-67px)] w-[272px] shrink-0 flex-col gap-5 overflow-y-auto border-r bg-card p-5 md:flex" aria-label="Question booklet">
    <div class="flex items-center justify-between"><h2 class="text-sm font-semibold">Booklet</h2><span class="text-xs text-muted-foreground tabular">${answeredCount()} of ${qs.length} answered</span></div>
    ${ToggleGroup({ items: [{ value: 'all', label: 'All' }, { value: 'unanswered', label: 'Unanswered' }, { value: 'flagged', label: 'Flagged' }], value: sp.filter, action: 'sp-filter', label: 'Show', cls: 'w-full [&>*]:flex-1' })}
    <div><p class="mb-2.5 text-xs font-medium text-muted-foreground">Multiple choice</p><div class="grid grid-cols-5 gap-2">${qs.map((q, i) => (q.type === 'mc' ? chip(q, i) : ''))}</div></div>
    <div><p class="mb-2.5 text-xs font-medium text-muted-foreground">Short answer</p><div class="grid grid-cols-5 gap-2">${qs.map((q, i) => (q.type === 'sa' ? chip(q, i) : ''))}</div></div>
    <ul class="grid grid-cols-1 gap-2 text-xs text-muted-foreground">${legend.map(([c, l]) => html`<li class="flex items-center gap-2.5"><span class="${cx('inline-block size-3 rounded-full', c)}"></span>${l}</li>`)}</ul>
    ${Button({ label: 'Read all questions', icon: 'list', variant: 'outline', size: 'sm', cls: 'mt-auto w-full', 'data-action': 'sp-read-all' })}
  </aside>`;
}

function QuestionView(q) {
  const sp = state.sp; const ans = sp.answers[q.n]; const fl = sp.flagged.includes(q.n);
  return html`<section data-slot="card" data-component="QuestionCard" class="gap-6 py-6 sm:py-7">
    <div class="flex flex-wrap items-center gap-2 px-6 sm:px-7">
      ${Badge({ variant: 'outline', label: `Question ${q.n}` })}${Badge({ variant: 'secondary', label: q.type === 'mc' ? 'Multiple choice' : 'Short answer' })}${Badge({ variant: 'secondary', label: plural(q.marks, 'mark') })}
      <span class="text-xs text-muted-foreground">${DEMO.subById[q.sub].name}</span>
    </div>
    <h2 class="px-6 text-[19px] leading-snug font-semibold tracking-[-0.01em] text-pretty sm:px-7 sm:text-[21px]">${q.text}</h2>
    <div class="px-6 sm:px-7">${q.type === 'mc'
      ? html`<div role="radiogroup" aria-label="Answer options" class="grid gap-2.5">${q.options.map((o, i) => {
          const on = ans === i;
          return html`<button type="button" role="radio" aria-checked="${String(on)}" data-action="sp-answer" data-value="${i}" data-key="opt-${q.n}-${i}" class="${cx('group flex w-full items-center gap-3.5 rounded-xl border px-4 py-3.5 text-left transition-[border-color,background-color,box-shadow] duration-150', on ? 'border-primary bg-primary/[0.035] ring-1 ring-primary dark:bg-primary/[0.07]' : 'hover:border-foreground/25 hover:bg-accent')}">
            <span class="${cx('grid size-7 shrink-0 place-items-center rounded-lg border text-xs font-semibold transition-colors', on ? 'border-primary bg-primary text-primary-foreground' : 'bg-card text-muted-foreground')}">${LETTERS[i]}</span>
            <span class="text-[15px] leading-snug">${o}</span>
          </button>`;
        })}</div>`
      : html`<div class="grid gap-2"><textarea data-slot="textarea" data-input="sp-text" data-key="sa-${q.n}" class="min-h-[240px] text-[15px] leading-7" placeholder="Write your answer as you would in the exam" aria-label="Your answer">${ans || ''}</textarea>
          <div class="flex justify-between text-xs text-muted-foreground"><span id="sa-words" class="tabular">${plural(wordCount(ans || ''), 'word')}</span><span>Saves as you type</span></div></div>`}
    </div>
    <div class="flex flex-wrap items-center justify-between gap-3 border-t px-6 pt-5 sm:px-7">
      ${Button({ label: fl ? 'Flagged for review' : 'Flag for review', icon: 'flag', variant: fl ? 'brand' : 'outline', size: 'sm', 'data-action': 'sp-flag', 'data-key': 'sp-flag', 'aria-pressed': String(fl) })}
      <p class="hidden items-center gap-1.5 text-xs text-muted-foreground sm:flex">${q.type === 'mc' ? html`${Kbd('A')}–${Kbd('D')} to answer · ${Kbd('←')}${Kbd('→')} to move · ${Kbd('F')} to flag` : html`${Kbd('Ctrl')}${Kbd('↵')} next question`}</p>
    </div>
  </section>`;
}

/* ---------- Flashcard session ---------------------------------------------- */
function FlashcardSessionPage() {
  const fs = state.fs; const cards = DEMO.flash.cards; const done = Object.keys(fs.ratings).length;
  const knew = Object.values(fs.ratings).filter((r) => r === 'knew').length;
  return html`<div class="flex min-h-svh flex-col">
    ${FocusBar({
      title: 'Due for review',
      meta: html`Card ${Math.min(fs.i + 1, cards.length)} of ${cards.length} · Knew ${knew} · <span class="inline-flex items-center gap-1">${Icon('check', 'size-3')}Saved</span>`,

/* ---------- Sprint results ------------------------------------------------- */
function sprintResult() {
  const src = state.results || { answers: DEMO.sprint.staged.answers, seconds: DEMO.sprint.staged.seconds, when: at(19, 20, 15), staged: true };
  const items = DEMO.sprint.questions.map((q) => {
    const a = src.answers[q.n];
    if (q.type === 'mc') {
      const answered = a != null; const right = answered && a === q.answer;
      return { q, a, answered, score: right ? 1 : 0, status: !answered ? 'blank' : right ? 'right' : 'wrong' };
    }
    const answered = typeof a === 'string' && a.trim().length > 0;
    const m = DEMO.marking[q.n];
    const exact = answered && a.trim() === DEMO.sprint.staged.answers[q.n];
    const score = !answered ? 0 : exact ? m.score : clamp(Math.round(wordCount(a) / 25), 1, q.marks - 1);
    return { q, a, answered, score, status: !answered ? 'blank' : score === q.marks ? 'right' : 'partial', marking: answered ? { ...m, segments: exact ? m.segments : [{ t: a }], score } : null };
  });
  const sum = (arr, k) => arr.reduce((s, x) => s + x[k], 0);
  const mc = items.filter((x) => x.q.type === 'mc'); const sa = items.filter((x) => x.q.type === 'sa');
  const score = sum(items, 'score'); const of = items.reduce((s, x) => s + x.q.marks, 0);
  const saOf = sa.reduce((s, x) => s + x.q.marks, 0);
  const subs = {};
  for (const it of items) { const k = it.q.sub; subs[k] ??= { id: k, score: 0, of: 0, missed: [] }; subs[k].score += it.score; subs[k].of += it.q.marks; if (it.status !== 'right') subs[k].missed.push(it.q.n); }
  return { ...src, items, score, of, mcScore: sum(mc, 'score'), mcOf: mc.length, saScore: sum(sa, 'score'), saOf, subs: Object.values(subs).sort((a, b) => (b.of - b.score) - (a.of - a.score)), mistakes: items.filter((x) => x.status !== 'right') };
}

    actions: html`${Button({ label: 'Same setup again', icon: 'rotate-ccw', variant: 'outline', 'data-action': 'r-same' })}${Button({ label: `Practise mistakes (${r.mistakes.length})`, icon: 'target', 'data-action': 'r-retry', disabled: !r.mistakes.length })}`,

    <div class="col-span-12 sm:col-span-6 xl:col-span-3">${tile('Time', fmtClock(r.seconds), mins - avg.sprintMinutes, ' min', { neutral: true })}</div>
    <div class="col-span-12 sm:col-span-6 xl:col-span-3">${tile('Multiple choice', html`${r.mcScore}<span class="text-[17px] font-semibold text-muted-foreground">/${r.mcOf}</span>`, mcP - avg.mc, ' pts')}</div>
    <div class="col-span-12 sm:col-span-6 xl:col-span-3">${tile('Written', html`${r.saScore}<span class="text-[17px] font-semibold text-muted-foreground">/${r.saOf}</span>`, saP - avg.written, ' pts')}</div>

    <div class="col-span-12 xl:col-span-8">${Card({
      component: 'NextStep', title: 'Your next step', description: 'Fix the marks you dropped while they’re fresh',
      body: html`${missedMc.length ? html`<div class="flex flex-wrap items-center gap-4 rounded-xl border border-brand/25 bg-brand-soft/60 p-4">
          <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-card text-brand">${Icon('rotate-ccw', 'size-5')}</span>
          <div class="min-w-0 flex-1"><p class="text-sm font-semibold">Retry the ${plural(missedMc.length, 'multiple choice question')} you missed</p><p class="text-[13px] text-muted-foreground">About ${missedMc.length + 1} minutes · explanations shown after each one</p></div>
          ${Button({ label: 'Retry mistakes', 'data-action': 'r-retry' })}
        </div>` : ''}
        <ul class="mt-3 grid gap-3 sm:grid-cols-2">${r.subs.filter((s) => s.score < s.of).map((s) => html`<li class="flex flex-col gap-3 rounded-xl border p-4">
          <div class="flex items-start justify-between gap-3"><div class="min-w-0"><p class="text-sm font-semibold">${DEMO.subById[s.id].name}</p><p class="text-xs text-muted-foreground">${s.of - s.score} of ${s.of} marks dropped · Q${s.missed.join(', Q')}</p></div><span class="text-[15px] font-bold tabular">${pct(s.score, s.of)}%</span></div>
          ${Meter({ value: pct(s.score, s.of), cls: 'h-1.5', label: 'Marks earned' })}
          <div class="flex flex-wrap gap-2">${Button({ label: 'Practise', size: 'sm', variant: 'outline', 'data-action': 'sprint-sub', 'data-value': s.id })}${Button({ label: 'Review cards', size: 'sm', variant: 'ghost', 'data-action': 'start-flash' })}</div>
        </li>`)}</ul>`,
    })}</div>
    <div class="col-span-12 xl:col-span-4">${Card({
      component: 'StrengthsAndFixes', title: 'Strengths and fixes',
      body: html`<div class="grid gap-5">
        <div><p class="mb-2 flex items-center gap-1.5 text-xs font-semibold text-success-text">${Icon('circle-check', 'size-3.5')}Strengths</p><ul class="grid grid-cols-1 gap-2 text-[13px] leading-snug">
          <li class="flex gap-2.5">${PenTick('mt-px size-4 shrink-0')}<span>${r.mcScore} of ${r.mcOf} multiple choice correct, ${mcP - avg.mc > 0 ? `${mcP - avg.mc} points above your average` : 'in line with your average'}.</span></li>
          <li class="flex gap-2.5">${PenTick('mt-px size-4 shrink-0')}<span>Your written answers name the right effects.</span></li>
        </ul></div>
        <div><p class="mb-2 flex items-center gap-1.5 text-xs font-semibold text-warning-text">${Icon('circle-alert', 'size-3.5')}Top fixes</p><ul class="grid grid-cols-1 gap-2 text-[13px] leading-snug">
          <li class="flex gap-2.5">${PenCaret('mt-px size-4 shrink-0')}<span>Explain the mechanism, not just the effect. Written answers lost ${r.saOf - r.saScore} marks here.</span></li>
          ${r.items.some((x) => x.status === 'blank') ? html`<li class="flex gap-2.5">${PenCaret('mt-px size-4 shrink-0')}<span>${plural(r.items.filter((x) => x.status === 'blank').length, 'question')} left blank. A guess can still earn the mark.</span></li>` : ''}
        </ul></div>
      </div>`,
    })}</div>

    <div class="col-span-12">${AnswersCard(r)}</div>
  </div>`;
}

function AnswersCard(r) {
  const sel = r.items.find((x) => x.q.n === state.resultsSel) || r.items[0];
  const tone = { right: 'bg-success-soft text-success-text border-transparent', wrong: 'bg-brand-soft text-brand-text border-transparent', partial: 'bg-warning-soft text-warning-text border-transparent', blank: 'border-dashed border-muted-foreground/45 bg-card text-muted-foreground' };
  const label = { right: 'Correct', wrong: 'Incorrect', partial: 'Part marks', blank: 'Not answered' };
  const chip = (it) => { const on = it.q.n === sel.q.n; return html`<button type="button" data-action="r-select" data-value="${it.q.n}" data-key="r-${it.q.n}" aria-pressed="${String(on)}" aria-label="Question ${it.q.n}: ${label[it.status]}" class="${cx('flex h-12 min-w-12 flex-col items-center justify-center rounded-xl border px-2 text-sm font-semibold tabular transition-shadow', tone[it.status], on && 'ring-2 ring-foreground ring-offset-2 ring-offset-card')}">${it.q.n}${it.q.type === 'sa' ? html`<span class="text-[10px] leading-none font-medium opacity-80">${it.score}/${it.q.marks}</span>` : ''}</button>`; };
  const legend = html`<div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-muted-foreground">${['right', 'partial', 'wrong', 'blank'].map((k) => html`<span class="flex items-center gap-1.5"><span class="${cx('size-3 rounded-[4px] border', tone[k])}"></span>${label[k]}</span>`)}</div>`;
  return Card({
    component: 'YourAnswers', title: 'Your answers', description: legend,
    action: ToggleGroup({ items: [{ value: 'grid', label: 'Review', icon: 'layout-grid' }, { value: 'table', label: 'Table', icon: 'table-2' }], value: state.resultsView, action: 'r-view', label: 'View' }),
    body: state.resultsView === 'table' ? ResultsTable(r) : html`<div class="grid gap-5">
      <div class="flex flex-wrap items-end gap-x-6 gap-y-3">
        <div><p class="mb-2 text-xs font-medium text-muted-foreground">Multiple choice</p><div class="flex flex-wrap gap-2">${r.items.filter((x) => x.q.type === 'mc').map(chip)}</div></div>
        <div><p class="mb-2 text-xs font-medium text-muted-foreground">Short answer</p><div class="flex flex-wrap gap-2">${r.items.filter((x) => x.q.type === 'sa').map(chip)}</div></div>
      </div>
      ${ResultDetail(sel, label)}
    </div>`,
  });
}

function ResultDetail(it, label) {
  const q = it.q;
  const status = { right: Badge({ variant: 'success', icon: 'check', label: 'Correct' }), wrong: Badge({ variant: 'brand', icon: 'x', label: 'Incorrect' }), partial: Badge({ variant: 'warning', label: `${it.score} of ${q.marks} marks` }), blank: Badge({ variant: 'muted', icon: 'circle-dashed', label: 'Not answered' }) }[it.status];
  let body;
  if (q.type === 'mc') {
    body = html`<ul class="grid grid-cols-1 gap-2">${q.options.map((o, i) => {
      const correct = i === q.answer; const picked = i === it.a;
      return html`<li class="${cx('flex items-center gap-3.5 rounded-xl border px-4 py-3', correct ? 'border-success/40 bg-success-soft/60' : picked ? 'border-brand/40 bg-brand-soft/60' : 'text-muted-foreground')}">
        <span class="${cx('grid size-7 shrink-0 place-items-center rounded-lg border text-xs font-semibold', correct ? 'border-success bg-success text-white' : picked ? 'border-brand bg-card text-brand-text' : 'bg-card')}">${LETTERS[i]}</span>
        <span class="flex-1 text-[15px] leading-snug ${correct || picked ? 'text-foreground' : ''}">${o}</span>
        ${correct ? html`<span class="flex shrink-0 items-center gap-1 text-xs font-semibold text-success-text">${Icon('check', 'size-3.5')}Correct answer</span>` : picked ? html`<span class="flex shrink-0 items-center gap-1.5 text-xs font-semibold text-brand-text">${PenCross('size-4')}Your answer</span>` : ''}
      </li>`;
    })}</ul>
    <div class="mt-3 rounded-xl bg-muted px-4 py-3.5"><p class="text-xs font-semibold">Why ${LETTERS[q.answer]} is right</p><p class="mt-1 text-[13px] leading-relaxed text-muted-foreground">${q.why}</p></div>`;
  } else if (it.marking) {
    body = html`${MarkupAnswer({ id: `r${q.n}`, segments: it.marking.segments, notes: it.marking.notes })}<p class="mt-4 rounded-xl bg-muted px-4 py-3 text-[13px] leading-relaxed">${it.marking.feedback}</p>`;
  } else {
    body = EmptyState({ icon: 'circle-dashed', title: 'Not answered', description: 'No answer was given, so there was nothing to mark. Have a go now and get feedback straight away.', action: Button({ label: 'Answer it in Mark my answer', size: 'sm', variant: 'outline', 'data-action': 'r-answer-now', 'data-value': q.n }) });
  }
  return html`<article data-component="ResultDetail" class="rounded-xl border bg-card p-5 sm:p-6">
    <div class="flex flex-wrap items-center gap-2">${Badge({ variant: 'outline', label: `Question ${q.n}` })}${Badge({ variant: 'secondary', label: q.type === 'mc' ? 'Multiple choice' : 'Short answer' })}<span class="text-xs text-muted-foreground">${DEMO.subById[q.sub].name} · ${plural(q.marks, 'mark')}</span><span class="ml-auto">${status}</span></div>
    <h3 class="mt-3 mb-4 text-[17px] leading-snug font-semibold text-pretty">${q.text}</h3>
    ${body}
    <div class="mt-5 flex flex-wrap gap-2 border-t pt-4">${Button({ label: 'Practise similar', icon: 'zap', variant: 'outline', size: 'sm', 'data-action': 'sprint-sub', 'data-value': q.sub })}${Button({ label: 'Report a problem', icon: 'flag', variant: 'ghost', size: 'sm', 'data-action': 'report' })}</div>
  </article>`;
}

function ResultsTable(r) {
  return html`<div class="relative overflow-x-auto rounded-xl border"><table data-slot="table" class="min-w-[640px]">
    <thead data-slot="table-header"><tr data-slot="table-row"><th data-slot="table-head" class="pl-4">Q</th><th data-slot="table-head">Type</th><th data-slot="table-head">Dot point</th><th data-slot="table-head">Your answer</th><th data-slot="table-head">Correct</th><th data-slot="table-head" class="pr-4 text-right">Marks</th></tr></thead>

    </tr>`)}</tbody>
  </table></div>`;
}

/* ==========================================================================
   UI KIT — template-only reference page (#/kit). Every primitive and Claro
   component on one screen, labelled with the name to build it under.

function KitPage() {
  const css = getComputedStyle(document.documentElement);
  const tok = (name) => css.getPropertyValue(`--${name}`).trim();
  const swatch = (name, note) => html`<li class="flex items-center gap-3"><span class="size-10 shrink-0 rounded-lg border" style="background:var(--${name})"></span><span class="min-w-0"><span class="block font-mono text-[12px]">--${name}</span><span class="block text-xs text-muted-foreground">${tok(name)}${note ? ` · ${note}` : ''}</span></span></li>`;
  const label = (t) => html`<p class="mb-2.5 text-xs font-medium text-muted-foreground">${t}</p>`;

/* ==========================================================================
   ROUTER, RENDER LOOP, ACTIONS, KEYBOARD
   Hash routes here; Next.js App Router paths in the app.
   ========================================================================== */
const ROUTES = {
  '': { title: 'Home', nav: 'home', render: HomePage },
  sprint: { title: 'Topic Sprint', nav: 'sprint', render: SprintBuilderPage },
  'sprint/session': { title: 'Sprint', nav: 'sprint', focus: true, render: SprintSessionPage },
  'sprint/results': { title: 'Sprint results', nav: 'sprint', render: SprintResultsPage },
  flashcards: { title: 'Flashcards', nav: 'flashcards', render: FlashcardsPage },
  'flashcards/session': { title: 'Flashcards', nav: 'flashcards', focus: true, render: FlashcardSessionPage },
  mark: { title: 'Mark my answer', nav: 'mark', render: MarkPage },
  'mark/result': { title: 'Marked answer', nav: 'mark', render: MarkResultPage },
  activity: { title: 'Activity', nav: 'activity', render: ActivityPage },
  progress: { title: 'Progress', nav: 'progress', render: ProgressPage },
  kit: { title: 'UI kit', nav: 'kit', render: KitPage },
};
const routeKey = () => { const h = location.hash.replace(/^#\/?/, '').replace(/\/$/, ''); return h in ROUTES ? h : ''; };
function go(href) { const target = href.replace(/^#\/?/, ''); if (routeKey() === target) { render(); window.scrollTo(0, 0); } else location.hash = href; }

let currentKey = null;
function captureFocus() {
  const a = document.activeElement;
  if (!a || a === document.body) return null;
  const k = a.dataset?.key || a.id;
  return k ? { k, s: a.selectionStart, e: a.selectionEnd } : null;
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.querySelector(`[data-key="${CSS.escape(f.k)}"]`) || document.getElementById(f.k);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (f.s != null && typeof el.setSelectionRange === 'function') { try { el.setSelectionRange(f.s, f.e); } catch { /* not a text field */ } }
}

function render() {
  const key = routeKey(); const route = ROUTES[key]; const fresh = key !== currentKey;
  const f = fresh ? null : captureFocus();
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  document.title = `${route.title} · Claro`;
  if (fresh) { currentKey = key; state.mobileNav = false; state.menu = null; state.cmd.open = false; }
  $('#app').innerHTML = (route.focus ? route.render() : AppShell(route, fresh)).s;
  if (fresh) window.scrollTo(0, 0);
  hydrateCharts($('#app'));
  paintOverlays();
  restoreFocus(f);
}
function paintOverlays() {
  const f = captureFocus();
  $('#overlays').innerHTML = Overlays().s;
  document.body.style.overflow = state.cmd.open || state.ask.open || state.dialog || state.mobileNav ? 'hidden' : '';
  restoreFocus(f);
  const log = $('#ask-log'); if (log) log.scrollTop = log.scrollHeight;
}
const focusKey = (k) => requestAnimationFrame(() => $(`[data-key="${k}"]`)?.focus());

let toastSeq = 0;
function toast(title, desc, opts = {}) {
  const id = ++toastSeq;
  state.toasts = [...state.toasts.slice(-2), { id, title, desc, ...opts }];
  paintOverlays();
  setTimeout(() => { state.toasts = state.toasts.filter((t) => t.id !== id); paintOverlays(); }, 3400);
}
const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };
function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; store.set('theme', state.theme); state.menu = null; render(); }
function startFlash() { state.fs = newFlash(); go('#/flashcards/session'); }
function sprintFor(subId, marks = 12) { Object.assign(state.builder, { type: 'mixed', subs: [subId], marks }); go('#/sprint'); }

/* Simulates the 3-pass marking pipeline: Analyst → Grader → Feedback writer. */
function runMarking(title, done) {
  state.dialog = { kind: 'marking', step: 0, title }; paintOverlays();
  const step = (s) => {
    if (state.dialog?.kind !== 'marking') return;
    state.dialog.step = s; paintOverlays();
    if (s < 3) setTimeout(() => step(s + 1), 620); else setTimeout(() => { state.dialog = null; paintOverlays(); done(); }, 320);
  };
  setTimeout(() => step(1), 620);
}

function askSend(text) {
  text = text.trim(); if (!text) return;
  state.ask.open = true; state.ask.msgs.push({ role: 'user', text }); state.ask.typing = true; paintOverlays();
  setTimeout(() => {
    state.ask.typing = false;
    state.ask.msgs.push({ role: 'claro', text: DEMO.askReplies[text] || 'In the app, Claro answers with your syllabus and recent marks in mind. In this template, try one of the suggested questions to see a full reply.' });
    paintOverlays();
    focusKey('ask-input');
  }, 900);
}

function calcPress(k) {
  const c = state.calc;
  if (k === 'C') { c.expr = ''; c.out = ''; return; }
  if (k === '=') {
    const s = c.expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    try { if (!/^[0-9.+\-*/ ]+$/.test(s)) throw new Error('bad'); const v = Function(`"use strict";return (${s})`)(); c.out = Number.isFinite(v) ? String(Math.round(v * 1e8) / 1e8) : 'Error'; } catch { c.out = 'Error'; }
    return;
  }
  if (c.out && c.out !== 'Error' && c.expr) { c.expr = '÷×−+'.includes(k) ? c.out : ''; c.out = ''; }
  c.expr += k;
}

    runMarking('Marking your sprint', () => {
      const r = sprintResult();
      state.resultsSel = (r.items.find((x) => x.q.type === 'sa' && x.answered) || r.items.find((x) => x.status !== 'right') || r.items[0]).q.n;
      state.sp = newSprint();
      go('#/sprint/results');
      toast('Sprint marked', `${r.score} of ${r.of} marks`);
    });
  },
  calc(el) { calcPress(el.dataset.value); paintOverlays(); },

  /* Flashcard session */
  'fs-view'(el) { state.fs.view = el.dataset.value; render(); },
  'fs-flip'() { state.fs.flipped = !state.fs.flipped; render(); focusKey(state.fs.flipped ? 'fs-rate-mostly' : 'fs-flip'); },
  'fs-skip'() { state.fs.flipped = false; state.fs.i = Math.min(state.fs.i + 1, DEMO.flash.cards.length); render(); },
  'fs-rate'(el) { const c = DEMO.flash.cards[state.fs.i]; if (c) state.fs.ratings[c.id] = el.dataset.value; A['fs-skip'](); focusKey('fs-flip'); },
  'fs-speak'() { toast('Speak your answer', 'In the app, your words fill the answer box. Type for now.', { icon: 'mic', tone: 'brand' }); },
  'fs-reveal'(el) { toggleIn(state.fs.revealed, el.dataset.value); render(); },
  'fs-finish'() { state.dialog = { kind: 'finish-flash' }; paintOverlays(); focusKey('dlg-confirm'); },
  'fs-restart'() {
    const missed = DEMO.flash.cards.filter((c) => ['missed', 'mostly'].includes(state.fs.ratings[c.id])).length;
    state.fs = newFlash(); render(); toast('Back to the start', missed ? `${plural(missed, 'card')} to go again` : 'No missed cards, so here’s the full deck.');
  },
  'confirm-finish-flash'() {
    const r = Object.values(state.fs.ratings);
    state.dialog = null; state.flashUnfinished = false;
    go('#/flashcards');
    toast('Session saved', `Knew ${r.filter((x) => x === 'knew').length} of ${r.length} cards`);
    state.fs = newFlash();
  },

  /* Results */
  'r-select'(el) { state.resultsSel = Number(el.dataset.value); render(); },
  'r-view'(el) { state.resultsView = el.dataset.value; render(); },
  'r-open'(el) { state.resultsSel = Number(el.dataset.value); state.resultsView = 'grid'; render(); },
  'r-retry'() { state.sp = newSprint(); go('#/sprint/session'); toast('Practising your mistakes', 'Explanations show after each one.'); },
  'r-same'() { state.builder = defaultBuilder(); state.sp = newSprint(); go('#/sprint/session'); },
  'r-answer-now'(el) { const q = DEMO.sprint.questions.find((x) => x.n === Number(el.dataset.value)); Object.assign(state.mark, { source: 'own', own: q.text, ownMarks: String(q.marks), answer: '', mode: 'type' }); go('#/mark'); focusKey('m-answer'); },
};
function runCommand(id) {
  const item = commandGroups().flatMap((g) => g.items).find((i) => i.id === id);
  state.cmd.open = false; paintOverlays();
  item?.run(); if (item && ['act-ask', 'act-theme'].includes(item.id)) paintOverlays();
  if (item?.id === 'act-ask') focusKey('ask-input');
}

/* ---------- Inputs (typing doesn't re-render unless the page must change) - */
const INPUT = {
  cmd(el) { state.cmd.q = el.value; state.cmd.i = 0; paintOverlays(); },
  'b-custom'(el) { state.builder.custom = el.value; render(); },
  'd-custom'(el) { state.deck.custom = el.value; render(); },
  'm-q'(el) { state.mark.q = el.value; render(); },
  'm-answer'(el) {
    state.mark.answer = el.value; const w = wordCount(el.value);
    const out = $('#m-words'); if (out) out.textContent = plural(w, 'word');
    const btn = $('#m-submit'); if (btn) btn.disabled = !(w >= 10 && (state.mark.source === 'own' ? state.mark.own.trim().length > 10 : !!selectedQuestion()));
  },
  'm-own'(el) { state.mark.own = el.value; },
  'act-q'(el) { state.act.q = el.value; state.act.shown = 12; render(); },
  'sp-text'(el) {
    const q = DEMO.sprint.questions[state.sp.i]; const was = isAnswered(q);
    state.sp.answers[q.n] = el.value;
    const out = $('#sa-words'); if (out) out.textContent = plural(wordCount(el.value), 'word');
    if (was !== isAnswered(q)) render();
  },
  'fs-text'(el) { const c = DEMO.flash.cards[state.fs.i]; if (c) state.fs.answers[c.id] = el.value; },
};
const CHANGE = {
  'b-from'(el) { state.builder.from = Number(el.value); if (state.builder.to < state.builder.from) state.builder.to = state.builder.from; render(); },
  'b-to'(el) { state.builder.to = Number(el.value); if (state.builder.from > state.builder.to) state.builder.from = state.builder.to; render(); },
  'm-type'(el) { state.mark.type = el.value; render(); },
  'm-topic'(el) { state.mark.topic = el.value; render(); },
  'm-year'(el) { state.mark.year = el.value; render(); },
  'm-own-marks'(el) { state.mark.ownMarks = el.value; },
  'm-photo'() { toast('Photo added', 'In the app, Claro reads your handwriting before marking.'); },
  'act-status'(el) { state.act.status = el.value; render(); },
  'act-topic'(el) { state.act.topic = el.value; render(); },
  'act-date'(el) { state.act.date = el.value; render(); },
  'act-sort'(el) { state.act.sort = el.value; render(); },
  'prog-range'(el) { state.prog.range = el.value; render(); },
};
const SUBMIT = {
  ask(form) { const v = String(new FormData(form).get('q') || ''); form.reset(); askSend(v); },
};

/* ---------- Event wiring ---------------------------------------------------- */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('a[href^="#/"]');
  if (nav && state.mobileNav && !nav.dataset.action) { state.mobileNav = false; if (nav.getAttribute('href').replace(/^#\/?/, '') === routeKey()) paintOverlays(); }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = A[el.dataset.action];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', (e) => { const el = e.target.closest?.('[data-input]'); if (el) INPUT[el.dataset.input]?.(el, e); });
document.addEventListener('change', (e) => { const el = e.target.closest?.('[data-change]'); if (el) CHANGE[el.dataset.change]?.(el, e); });
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); SUBMIT[f.dataset.submit]?.(f, e); });

/* Hover tooltips for [data-tip] (heatmap cells) */
document.addEventListener('pointerover', (e) => {
  const tip = $('#tip'); if (!tip) return;
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tip.style.opacity = '0'; } else {
    tip.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect(); const w = tip.offsetWidth;
    tip.style.left = `${clamp(r.left + r.width / 2 - w / 2, 8, innerWidth - w - 8)}px`;
    tip.style.top = `${r.top - tip.offsetHeight - 8}px`;
    tip.style.opacity = '1';
  }
  /* MarkupAnswer: light up the words a note refers to */
  const note = e.target.closest?.('[data-note-ref]');
  $$('.mk.is-hot, .mk-caret.is-hot').forEach((x) => x.classList.remove('is-hot'));
  if (note) $$(`[data-note="${note.dataset.noteRef}"]`).forEach((x) => x.classList.add('is-hot'));
});
document.addEventListener('focusin', (e) => {
  const note = e.target.closest?.('[data-note-ref]');
  $$('.mk.is-hot, .mk-caret.is-hot').forEach((x) => x.classList.remove('is-hot'));
  if (note) $$(`[data-note="${note.dataset.noteRef}"]`).forEach((x) => x.classList.add('is-hot'));
});

function closeTop() {
  if (state.menu) { state.menu = null; paintOverlays(); return true; }
  if (state.cmd.open) { state.cmd.open = false; paintOverlays(); return true; }
  if (state.dialog && state.dialog.kind !== 'marking') { state.dialog = null; paintOverlays(); return true; }
  if (state.ask.open) { state.ask.open = false; paintOverlays(); return true; }
  if (state.mobileNav) { state.mobileNav = false; paintOverlays(); return true; }
  return false;
}

document.addEventListener('keydown', (e) => {
  const typing = !!e.target.closest?.('input, textarea, select, [contenteditable="true"]');
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); if (state.cmd.open) A['close-command'](); else A['open-command'](); return; }
  if (e.key === 'Escape') { if (closeTop()) e.preventDefault(); return; }
  if (state.cmd.open) {
    const flat = commandGroups().flatMap((g) => g.items);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      state.cmd.i = (state.cmd.i + (e.key === 'ArrowDown' ? 1 : -1) + flat.length) % Math.max(1, flat.length);
      paintOverlays(); $('#cmd-list [aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') { e.preventDefault(); const it = flat[state.cmd.i]; if (it) runCommand(it.id); }
    return;
  }
  if (state.dialog || state.ask.open || state.menu || state.mobileNav) return;
  const key = routeKey();
  if (key === 'sprint/session') {
    if (typing) { if (mod && e.key === 'Enter') { e.preventDefault(); A['sp-next'](); } return; }
    if (mod || e.altKey) return;
    const q = DEMO.sprint.questions[state.sp.i]; const k = e.key.toUpperCase();
    if (q.type === 'mc' && k.length === 1 && 'ABCD'.includes(k)) { state.sp.answers[q.n] = 'ABCD'.indexOf(k); render(); focusKey(`opt-${q.n}-${'ABCD'.indexOf(k)}`); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); A['sp-next'](); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); A['sp-prev'](); }
    if (k === 'F') A['sp-flag']();
  }
  if (key === 'flashcards/session') {
    if (typing) { if (mod && e.key === 'Enter') { e.preventDefault(); A['fs-flip'](); } return; }
    if (mod || e.altKey) return;
    if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button, a') && state.fs.view === 'one') { e.preventDefault(); A['fs-flip'](); }
    if (state.fs.flipped && ['1', '2', '3'].includes(e.key)) { const c = DEMO.flash.cards[state.fs.i]; if (c) state.fs.ratings[c.id] = ['missed', 'mostly', 'knew'][Number(e.key) - 1]; A['fs-skip'](); }
    if (e.key.toLowerCase() === 's') A['fs-skip']();
    if (e.key.toLowerCase() === 'l') { state.fs.view = state.fs.view === 'list' ? 'one' : 'list'; render(); }
  }
});

/* Session clocks: update text only, never re-render every second. */
setInterval(() => {
  const key = routeKey();
  if (key === 'sprint/session' && !state.dialog && state.sp.left > 0) {
    state.sp.left--;
    const el = $('#sp-time'); if (el) el.textContent = fmtClock(state.sp.left);
    if (state.sp.left === 299) render();
    if (state.sp.left === 0) toast('Time’s up', 'Finish and mark when you’re ready.', { icon: 'timer', tone: 'brand' });
  }
  if (key === 'flashcards/session' && !state.dialog && state.fs.view === 'one' && state.fs.i < DEMO.flash.cards.length) {
    state.fs.elapsed++;
    const el = $('#fs-clock'); if (el) el.textContent = fmtClock(state.fs.elapsed);
  }
}, 1000);

window.addEventListener('hashchange', render);
render();

</script>
</body>
</html>
