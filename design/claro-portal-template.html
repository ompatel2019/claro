<html lang="en-AU">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Claro · Student portal</title>
<meta name="description" content="Claro student portal: UI template and design reference.">
<!--
  ============================================================================
  CLARO · STUDENT PORTAL · UI TEMPLATE
  ============================================================================
  A clickable, single-file reference for the revamped student portal.
  Same features as the live portal. New layout, components and system.
  Open it in a browser; every page and flow works with demo data.

  FOR THE CODING AGENT: how to turn this into the real app
  1. Tokens. Copy the first <style id="claro-tokens"> block into
     app/globals.css (shadcn/ui + Tailwind v4 format: :root, .dark,
     @theme inline). Brand colours are unchanged.
  2. Primitives. Every element with data-slot="…" is a shadcn/ui component,
     and data-variant / data-size are its props:
       button, card (+ header/title/description/action/content/footer),
       badge, input, textarea, select-trigger, toggle-group, switch,
       checkbox, progress, separator, kbd, skeleton, avatar, table,
       sheet-content, dialog-content, popover-content, empty, sidebar.
     Buttons, chips and toggle groups are pills (rounded-full).
     Their exact styles are in the readable source CSS near the end of
     this file: <script type="text/css" id="claro-source-css">.
  3. Claro components. Every data-component="…" is a component to build
     once in components/claro/* and reuse on the admin side too:
       PageHeader, Topbar, FocusBar, StatCard, DeltaPill, Meter, Ring,
       ScoreRing, TargetGauge, StudyHeatmap, BarList, TermProgress,
       ExamCountdown, PenCircle, MarkupAnswer, MarkingBands, SprintSummary…
  4. Charts. See CHARTS + drawArea/drawBars in the script. Rebuild with
     shadcn charts (Recharts): monotone Area, 2px stroke, ~12% gradient,
     dashed ReferenceLine for the target; Bars ≤ 24px, radius [4,4,0,0],
     grey bars + one coral highlight. Every chart gets a table toggle.
  5. Pages. Each *Page() function is a route:
       #/                → /student            #/activity → /student/activity
       #/sprint          → /student/sprint     #/progress → /student/progress
       #/sprint/session  → /student/sprint/[id]
       #/sprint/results  → /student/sprint/[id]/results
       #/flashcards      → /student/flashcards (+ /[id] for the session)
       #/mark            → /student/mark       #/mark/result → /student/mark/[id]
       #/kit             → template-only reference page
  6. Icons. Icon('zap') → lucide-react <Zap />. Stroke width 1.75.
  7. Data. DEMO holds one mid-range demo student. Keep the shapes, wire
     them to Supabase. Nothing in the UI hard-codes Economics.

  Type: Hanken Grotesk everywhere (Space Mono only for timers). When the
  custom font lands, change --font-sans and nothing else.
  ============================================================================
-->

/* ==========================================================================
   CLARO DESIGN TOKENS
   Paste this block into app/globals.css (shadcn/ui + Tailwind v4 format).
   Brand colours are unchanged from the live portal:
     navy  #1B1F34   coral #FD3F2A   canvas #F6F2F2   blush #FFEFEB
   Rule of thumb: neutrals do 90% of the work. Coral is reserved for
   (1) the active nav item, (2) the ONE highlighted data point per chart,
   (3) the examiner's pen (markup, needs-work).
   ========================================================================== */
:root {
  --radius: 0.75rem;

  /* surfaces + ink */
  --background: #F6F2F2;          /* page canvas (brand) */
  --foreground: #1B1F34;          /* ink (brand navy) */
  --card: #FFFFFF;
  --card-foreground: #1B1F34;
  --popover: #FFFFFF;
  --popover-foreground: #1B1F34;

  /* shadcn roles */
  --primary: #1B1F34;             /* primary buttons, selected chips */
  --primary-foreground: #FFFFFF;
  --secondary: #F2EDED;
  --secondary-foreground: #1B1F34;
  --muted: #F4F0F0;               /* tracks, icon tiles, table heads */
  --muted-foreground: #616474;    /* 5.9:1 on white */
  --accent: #F6F2F2;              /* hover wash */
  --accent-foreground: #1B1F34;
  --destructive: #D92D20;
  --border: #EBE5E5;              /* hairlines */
  --input: #E2DADB;
  --ring: #1B1F34;
  --toggle-on: #FFFFFF;           /* active segment in a toggle group */

  /* brand */
  --brand: #FD3F2A;               /* coral: marks, indicators, highlights */
  --brand-foreground: #FFFFFF;
  --brand-soft: #FFEFEB;          /* blush: active nav, brand badges */
  --brand-text: #C42A15;          /* coral text that passes AA on white + blush */
  --brand-deep: #E73C2B;          /* the stripe in the term banner */

  /* status (always paired with an icon + label) */
  --success: #12875A;
  --success-soft: #E6F4EC;
  --success-text: #0E6B47;
  --warning: #C77B0A;
  --warning-soft: #FCF0DC;
  --warning-text: #8A5300;

  /* charts */
  --chart-1: #1B1F34;             /* main series */
  --chart-2: #FD3F2A;             /* the one highlighted mark */
  --chart-3: #CFC8CA;             /* de-emphasised marks */
  --chart-grid: #F1ECEC;          /* hairline gridlines (solid, never dashed) */
  --chart-axis: #616474;          /* tick labels */
  --chart-track: #EEEBEE;         /* meter track = lighter step of navy */
  --heat-0: #F1ECEC;              /* heatmap: one hue, light -> dark */
  --heat-1: #FFD6CC;
  --heat-2: #FFA592;
  --heat-3: #FF6F57;
  --heat-4: #FD3F2A;

  /* sidebar (shadcn sidebar block) */
  --sidebar: #FFFFFF;
  --sidebar-foreground: #1B1F34;
  --sidebar-primary: #FD3F2A;
  --sidebar-primary-foreground: #FFFFFF;
  --sidebar-accent: #FFEFEB;
  --sidebar-accent-foreground: #1B1F34;
  --sidebar-border: #EBE5E5;
  --sidebar-ring: #1B1F34;

  --shadow-ink: 27 31 52;
}

.dark {
  --background: #10121A;
  --foreground: #F2EEEE;
  --card: #171A25;
  --card-foreground: #F2EEEE;
  --popover: #1B1F2C;
  --popover-foreground: #F2EEEE;

  --primary: #F2EEEE;
  --primary-foreground: #1B1F34;
  --secondary: #232736;
  --secondary-foreground: #F2EEEE;
  --muted: #1F2230;
  --muted-foreground: #9B9EAF;
  --accent: #212433;
  --accent-foreground: #F2EEEE;
  --destructive: #FF6B5E;
  --border: #262A39;
  --input: #2E3243;
  --ring: #F2EEEE;
  --toggle-on: #2C3042;

  --brand: #FF4E39;
  --brand-foreground: #FFFFFF;
  --brand-soft: #35202A;
  --brand-text: #FF8A75;
  --brand-deep: #E73C2B;

  --success: #3CC48A;
  --success-soft: #16291F;
  --success-text: #5BD7A0;
  --warning: #F0A93B;
  --warning-soft: #2E2615;
  --warning-text: #F5BE68;

  --chart-1: #D9DBE6;
  --chart-2: #FF4E39;
  --chart-3: #4D5266;
  --chart-grid: #232636;
  --chart-axis: #8E91A3;
  --chart-track: #262A39;
  --heat-0: #212433;
  --heat-1: #4A2830;
  --heat-2: #7E3331;
  --heat-3: #C2402F;
  --heat-4: #FF4E39;

  --sidebar: #141620;
  --sidebar-foreground: #F2EEEE;
  --sidebar-primary: #FF4E39;
  --sidebar-primary-foreground: #FFFFFF;
  --sidebar-accent: #35202A;
  --sidebar-accent-foreground: #F2EEEE;
  --sidebar-border: #232636;
  --sidebar-ring: #F2EEEE;

  --shadow-ink: 0 0 0;
}

@theme inline {
  --font-sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-toggle-on: var(--toggle-on);

  --color-brand: var(--brand);
  --color-brand-foreground: var(--brand-foreground);
  --color-brand-soft: var(--brand-soft);
  --color-brand-text: var(--brand-text);
  --color-brand-deep: var(--brand-deep);

  --color-success: var(--success);
  --color-success-soft: var(--success-soft);
  --color-success-text: var(--success-text);
  --color-warning: var(--warning);
  --color-warning-soft: var(--warning-soft);
  --color-warning-text: var(--warning-text);

  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-grid: var(--chart-grid);
  --color-chart-axis: var(--chart-axis);
  --color-chart-track: var(--chart-track);
  --color-heat-0: var(--heat-0);
  --color-heat-1: var(--heat-1);
  --color-heat-2: var(--heat-2);
  --color-heat-3: var(--heat-3);
  --color-heat-4: var(--heat-4);

  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --radius-sm: calc(var(--radius) - 4px);   /*  8px  chips inside inputs   */
  --radius-md: calc(var(--radius) - 2px);   /* 10px  inputs, selects       */
  --radius-lg: var(--radius);               /* 12px  tiles inside cards    */
  --radius-xl: calc(var(--radius) + 4px);   /* 16px  cards                 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 20px  sheets, dialogs       */

  --shadow-xs: 0 1px 2px rgb(var(--shadow-ink) / 0.05);
  --shadow-card: 0 1px 2px rgb(var(--shadow-ink) / 0.04);
  --shadow-pop: 0 12px 32px -8px rgb(var(--shadow-ink) / 0.18), 0 2px 6px rgb(var(--shadow-ink) / 0.06);
}

<script type="text/css" id="claro-source-css">
@import "tailwindcss" source("./");

/* Class-based dark mode, same as shadcn/ui: put `.dark` on <html>. */
@custom-variant dark (&:where(.dark, .dark *));

/* @tokens-start */
/* ==========================================================================
   CLARO DESIGN TOKENS
   Paste this block into app/globals.css (shadcn/ui + Tailwind v4 format).
   Brand colours are unchanged from the live portal:
     navy  #1B1F34   coral #FD3F2A   canvas #F6F2F2   blush #FFEFEB
   Rule of thumb: neutrals do 90% of the work. Coral is reserved for
   (1) the active nav item, (2) the ONE highlighted data point per chart,
   (3) the examiner's pen (markup, needs-work).
   ========================================================================== */
:root {
  --radius: 0.75rem;

  /* surfaces + ink */
  --background: #F6F2F2;          /* page canvas (brand) */
  --foreground: #1B1F34;          /* ink (brand navy) */
  --card: #FFFFFF;
  --card-foreground: #1B1F34;
  --popover: #FFFFFF;
  --popover-foreground: #1B1F34;

  /* shadcn roles */
  --primary: #1B1F34;             /* primary buttons, selected chips */
  --primary-foreground: #FFFFFF;
  --secondary: #F2EDED;
  --secondary-foreground: #1B1F34;
  --muted: #F4F0F0;               /* tracks, icon tiles, table heads */
  --muted-foreground: #616474;    /* 5.9:1 on white */
  --accent: #F6F2F2;              /* hover wash */
  --accent-foreground: #1B1F34;
  --destructive: #D92D20;
  --border: #EBE5E5;              /* hairlines */
  --input: #E2DADB;
  --ring: #1B1F34;
  --toggle-on: #FFFFFF;           /* active segment in a toggle group */

  /* brand */
  --brand: #FD3F2A;               /* coral: marks, indicators, highlights */
  --brand-foreground: #FFFFFF;
  --brand-soft: #FFEFEB;          /* blush: active nav, brand badges */
  --brand-text: #C42A15;          /* coral text that passes AA on white + blush */
  --brand-deep: #E73C2B;          /* the stripe in the term banner */

  /* status (always paired with an icon + label) */
  --success: #12875A;
  --success-soft: #E6F4EC;
  --success-text: #0E6B47;
  --warning: #C77B0A;
  --warning-soft: #FCF0DC;
  --warning-text: #8A5300;

  /* charts */
  --chart-1: #1B1F34;             /* main series */
  --chart-2: #FD3F2A;             /* the one highlighted mark */
  --chart-3: #CFC8CA;             /* de-emphasised marks */
  --chart-grid: #F1ECEC;          /* hairline gridlines (solid, never dashed) */
  --chart-axis: #616474;          /* tick labels */
  --chart-track: #EEEBEE;         /* meter track = lighter step of navy */
  --heat-0: #F1ECEC;              /* heatmap: one hue, light -> dark */
  --heat-1: #FFD6CC;
  --heat-2: #FFA592;
  --heat-3: #FF6F57;
  --heat-4: #FD3F2A;

  /* sidebar (shadcn sidebar block) */
  --sidebar: #FFFFFF;
  --sidebar-foreground: #1B1F34;
  --sidebar-primary: #FD3F2A;
  --sidebar-primary-foreground: #FFFFFF;
  --sidebar-accent: #FFEFEB;
  --sidebar-accent-foreground: #1B1F34;
  --sidebar-border: #EBE5E5;
  --sidebar-ring: #1B1F34;

  --shadow-ink: 27 31 52;
}

.dark {
  --background: #10121A;
  --foreground: #F2EEEE;
  --card: #171A25;
  --card-foreground: #F2EEEE;
  --popover: #1B1F2C;
  --popover-foreground: #F2EEEE;

  --primary: #F2EEEE;
  --primary-foreground: #1B1F34;
  --secondary: #232736;
  --secondary-foreground: #F2EEEE;
  --muted: #1F2230;
  --muted-foreground: #9B9EAF;
  --accent: #212433;
  --accent-foreground: #F2EEEE;
  --destructive: #FF6B5E;
  --border: #262A39;
  --input: #2E3243;
  --ring: #F2EEEE;
  --toggle-on: #2C3042;

  --brand: #FF4E39;
  --brand-foreground: #FFFFFF;
  --brand-soft: #35202A;
  --brand-text: #FF8A75;
  --brand-deep: #E73C2B;

  --success: #3CC48A;
  --success-soft: #16291F;
  --success-text: #5BD7A0;
  --warning: #F0A93B;
  --warning-soft: #2E2615;
  --warning-text: #F5BE68;

  --chart-1: #D9DBE6;
  --chart-2: #FF4E39;
  --chart-3: #4D5266;
  --chart-grid: #232636;
  --chart-axis: #8E91A3;
  --chart-track: #262A39;
  --heat-0: #212433;
  --heat-1: #4A2830;
  --heat-2: #7E3331;
  --heat-3: #C2402F;
  --heat-4: #FF4E39;

  --sidebar: #141620;
  --sidebar-foreground: #F2EEEE;
  --sidebar-primary: #FF4E39;
  --sidebar-primary-foreground: #FFFFFF;
  --sidebar-accent: #35202A;
  --sidebar-accent-foreground: #F2EEEE;
  --sidebar-border: #232636;
  --sidebar-ring: #F2EEEE;

  --shadow-ink: 0 0 0;
}

@theme inline {
  --font-sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-destructive: var(--destructive);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-toggle-on: var(--toggle-on);

  --color-brand: var(--brand);
  --color-brand-foreground: var(--brand-foreground);
  --color-brand-soft: var(--brand-soft);
  --color-brand-text: var(--brand-text);
  --color-brand-deep: var(--brand-deep);

  --color-success: var(--success);
  --color-success-soft: var(--success-soft);
  --color-success-text: var(--success-text);
  --color-warning: var(--warning);
  --color-warning-soft: var(--warning-soft);
  --color-warning-text: var(--warning-text);

  --color-chart-1: var(--chart-1);
  --color-chart-2: var(--chart-2);
  --color-chart-3: var(--chart-3);
  --color-chart-grid: var(--chart-grid);
  --color-chart-axis: var(--chart-axis);
  --color-chart-track: var(--chart-track);
  --color-heat-0: var(--heat-0);
  --color-heat-1: var(--heat-1);
  --color-heat-2: var(--heat-2);
  --color-heat-3: var(--heat-3);
  --color-heat-4: var(--heat-4);

  --color-sidebar: var(--sidebar);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-ring: var(--sidebar-ring);

  --radius-sm: calc(var(--radius) - 4px);   /*  8px  chips inside inputs   */
  --radius-md: calc(var(--radius) - 2px);   /* 10px  inputs, selects       */
  --radius-lg: var(--radius);               /* 12px  tiles inside cards    */
  --radius-xl: calc(var(--radius) + 4px);   /* 16px  cards                 */
  --radius-2xl: calc(var(--radius) + 8px);  /* 20px  sheets, dialogs       */

  --shadow-xs: 0 1px 2px rgb(var(--shadow-ink) / 0.05);
  --shadow-card: 0 1px 2px rgb(var(--shadow-ink) / 0.04);
  --shadow-pop: 0 12px 32px -8px rgb(var(--shadow-ink) / 0.18), 0 2px 6px rgb(var(--shadow-ink) / 0.06);
}

/* @tokens-end */

/* ==========================================================================
   BASE
   ========================================================================== */
@layer base {
  * { @apply border-border; }
  html { color-scheme: light; -webkit-text-size-adjust: 100%; }
  html.dark { color-scheme: dark; }
  body {
    @apply bg-background text-foreground font-sans antialiased;
    font-size: 14px;
    line-height: 1.5;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: color-mix(in srgb, var(--brand) 22%, transparent); }
  button, [role="button"], a { -webkit-tap-highlight-color: transparent; }
  button:not(:disabled), [role="button"] { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  input, textarea, select { font: inherit; color: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }
}

/* ==========================================================================
   SHADCN-EQUIVALENT PRIMITIVES
   Styled through data-slot / data-variant / data-size, exactly like
   shadcn/ui v4 renders them. In React these are <Button variant size>, etc.
   ========================================================================== */
@layer components {
  /* --- Button ------------------------------------------------------------ */
  [data-slot="button"] {
    @apply inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-full px-4 text-sm font-medium whitespace-nowrap select-none;
    @apply transition-[color,background-color,border-color,box-shadow,opacity] duration-150;
    @apply outline-none focus-visible:ring-[3px] focus-visible:ring-ring/15;
    @apply disabled:pointer-events-none disabled:opacity-45 aria-disabled:pointer-events-none aria-disabled:opacity-45;
    @apply [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4;
  }
  [data-slot="button"]:focus-visible { outline: none; }
  [data-slot="button"][data-variant="default"] { @apply bg-primary text-primary-foreground shadow-xs hover:bg-primary/88; }
  [data-slot="button"][data-variant="brand"] { @apply bg-brand-soft text-brand-text hover:bg-brand/15; }
  [data-slot="button"][data-variant="secondary"] { @apply bg-secondary text-secondary-foreground hover:bg-secondary/70 dark:hover:bg-secondary/80; }
  [data-slot="button"][data-variant="outline"] { @apply border border-input bg-card text-foreground shadow-xs hover:bg-accent dark:bg-card dark:hover:bg-accent; }
  [data-slot="button"][data-variant="ghost"] { @apply text-foreground hover:bg-accent dark:hover:bg-accent; }
  [data-slot="button"][data-variant="link"] { @apply h-auto rounded-sm px-0 underline-offset-4 hover:underline; }
  [data-slot="button"][data-size="sm"] { @apply h-8 gap-1.5 px-3 text-[13px]; }
  [data-slot="button"][data-size="lg"] { @apply h-11 px-6 text-[15px]; }
  [data-slot="button"][data-size="icon"] { @apply size-9 px-0; }
  [data-slot="button"][data-size="icon-sm"] { @apply size-8 px-0; }
  [data-slot="button"][data-variant="link"][data-size] { @apply h-auto px-0; }

  /* --- Card ---------------------------------------------------------------- */
  [data-slot="card"] {
    @apply flex flex-col gap-4 rounded-xl border bg-card py-5 text-card-foreground;
    box-shadow: var(--shadow-card);
  }
  [data-slot="card-header"] {
    @apply grid auto-rows-min grid-rows-[auto_auto] items-start gap-x-3 gap-y-1 px-5;
  }
  [data-slot="card-header"]:has(> [data-slot="card-action"]) { grid-template-columns: minmax(0, 1fr) auto; }
  [data-slot="card-title"] { @apply text-[15px] leading-snug font-semibold tracking-[-0.01em]; }
  [data-slot="card-description"] { @apply text-[13px] leading-snug text-muted-foreground; }
  [data-slot="card-action"] { @apply col-start-2 row-span-2 row-start-1 flex items-center gap-1 self-start justify-self-end; }
  [data-slot="card-content"] { @apply px-5; }
  [data-slot="card-footer"] { @apply flex items-center px-5; }

  /* --- Badge --------------------------------------------------------------- */
  [data-slot="badge"] {
    @apply inline-flex h-[22px] shrink-0 items-center gap-1 rounded-full border border-transparent px-2 text-xs font-medium whitespace-nowrap;
    @apply [&>svg]:size-3 [&>svg]:shrink-0;
  }
  [data-slot="badge"][data-variant="default"] { @apply bg-primary text-primary-foreground; }
  [data-slot="badge"][data-variant="secondary"] { @apply bg-secondary text-secondary-foreground; }
  [data-slot="badge"][data-variant="outline"] { @apply border-border bg-card text-foreground; }
  [data-slot="badge"][data-variant="muted"] { @apply bg-muted text-muted-foreground; }
  [data-slot="badge"][data-variant="brand"] { @apply bg-brand-soft text-brand-text; }
  [data-slot="badge"][data-variant="success"] { @apply bg-success-soft text-success-text; }
  [data-slot="badge"][data-variant="warning"] { @apply bg-warning-soft text-warning-text; }

  /* --- Input / Textarea / Select ------------------------------------------ */
  [data-slot="input"], [data-slot="textarea"], [data-slot="select-trigger"] {
    @apply w-full min-w-0 rounded-md border border-input bg-card px-3 text-sm text-foreground shadow-xs outline-none;
    @apply transition-[border-color,box-shadow] duration-150 placeholder:text-muted-foreground;
    @apply focus-visible:border-ring/50 focus-visible:ring-[3px] focus-visible:ring-ring/10;
    @apply disabled:cursor-not-allowed disabled:opacity-50;
  }
  [data-slot="input"]:focus-visible, [data-slot="textarea"]:focus-visible, [data-slot="select-trigger"]:focus-visible { outline: none; }
  [data-slot="input"] { @apply h-9; }
  [data-slot="textarea"] { @apply min-h-24 resize-y py-2.5 leading-relaxed; field-sizing: content; }
  [data-slot="select-trigger"] { @apply h-9 cursor-pointer appearance-none pr-9; }
  [data-slot="select"] { @apply relative inline-flex w-full min-w-0; }
  [data-slot="select"] > svg { @apply pointer-events-none absolute top-1/2 right-3 size-4 -translate-y-1/2 text-muted-foreground; }
  [data-slot="input-group"] { @apply relative flex w-full items-center; }
  [data-slot="input-group"] > svg:first-child { @apply pointer-events-none absolute left-3 size-4 text-muted-foreground; }
  [data-slot="input-group"] > svg:first-child + [data-slot="input"] { @apply pl-9; }

  [data-slot="label"] { @apply text-[13px] font-medium text-foreground; }

  /* --- Toggle group (segmented control) ------------------------------------ */
  [data-slot="toggle-group"] { @apply inline-flex items-center gap-0.5 rounded-full bg-muted p-[3px]; }
  [data-slot="toggle-group-item"] {
    @apply inline-flex h-7 items-center justify-center gap-1.5 rounded-full px-3 text-[13px] font-medium whitespace-nowrap text-muted-foreground;
    @apply transition-[color,background-color,box-shadow] duration-150 hover:text-foreground;
    @apply [&_svg]:size-3.5;
  }
  [data-slot="toggle-group-item"][data-state="on"] { @apply bg-toggle-on text-foreground; box-shadow: 0 1px 2px rgb(var(--shadow-ink) / 0.10), 0 0 0 1px rgb(var(--shadow-ink) / 0.04); }

  /* --- Choice chip (single or multi select) ------------------------------- */
  [data-slot="chip"] {
    @apply inline-flex h-8 items-center gap-1.5 rounded-full border border-input bg-card px-3 text-[13px] font-medium whitespace-nowrap text-foreground;
    @apply transition-[color,background-color,border-color] duration-150 hover:border-foreground/25;
    @apply [&_svg]:size-3.5;
  }
  [data-slot="chip"][data-state="on"] { @apply border-primary bg-primary text-primary-foreground; }
  [data-slot="chip"] .chip-count { @apply text-muted-foreground tabular-nums; }
  [data-slot="chip"][data-state="on"] .chip-count { @apply text-primary-foreground/70; }

  /* --- Option card (radio card) -------------------------------------------- */
  [data-slot="option-card"] {
    @apply relative flex w-full flex-col items-start gap-1 rounded-lg border border-input bg-card p-4 text-left;
    @apply transition-[border-color,background-color,box-shadow] duration-150 hover:border-foreground/25;
  }
  [data-slot="option-card"][data-state="on"] { @apply border-brand bg-brand-soft/60 ring-[3px] ring-brand/10; }
  [data-slot="option-card"] .option-dot { @apply absolute top-4 right-4 grid size-4 place-items-center rounded-full border border-input bg-card; }
  [data-slot="option-card"][data-state="on"] .option-dot { @apply border-brand; }
  [data-slot="option-card"][data-state="on"] .option-dot::after { content: ""; @apply size-2 rounded-full bg-brand; }

  /* --- Switch --------------------------------------------------------------- */
  [data-slot="switch"] {
    @apply relative inline-flex h-5 w-9 shrink-0 items-center rounded-full border border-transparent bg-input transition-colors duration-150;
  }
  [data-slot="switch"][data-state="on"] { @apply bg-primary; }
  [data-slot="switch"] > span { @apply block size-4 translate-x-0.5 rounded-full bg-card shadow-xs transition-transform duration-150; }
  [data-slot="switch"][data-state="on"] > span { @apply translate-x-[18px] dark:bg-[#1B1F34]; }

  /* --- Checkbox ------------------------------------------------------------- */
  [data-slot="checkbox"] {
    @apply grid size-4 shrink-0 place-items-center rounded-[5px] border border-input bg-card text-primary-foreground transition-colors duration-150;
  }
  [data-slot="checkbox"][data-state="on"] { @apply border-primary bg-primary; }
  [data-slot="checkbox"] svg { @apply size-3; }
  [data-slot="checkbox"][data-state="indeterminate"] { @apply border-primary bg-primary; }

  /* --- Progress / Separator / Kbd / Skeleton / Avatar ------------------------ */
  [data-slot="progress"] { @apply relative h-1.5 w-full overflow-hidden rounded-full bg-chart-track; }
  [data-slot="progress-indicator"] { @apply h-full rounded-full bg-primary transition-[width] duration-300; }
  [data-slot="separator"] { @apply shrink-0 bg-border; }
  [data-slot="separator"][data-orientation="horizontal"] { @apply h-px w-full; }
  [data-slot="separator"][data-orientation="vertical"] { @apply h-full w-px; }
  [data-slot="kbd"] {
    @apply inline-flex h-5 min-w-5 items-center justify-center rounded-[5px] border bg-muted px-1 font-sans text-[11px] font-medium text-muted-foreground;
  }
  [data-slot="skeleton"] { @apply animate-pulse rounded-md bg-muted; }
  [data-slot="avatar"] {
    @apply relative inline-grid size-8 shrink-0 place-items-center overflow-hidden rounded-full bg-brand-soft text-xs font-semibold text-brand-text;
  }

  /* --- Table --------------------------------------------------------------- */
  [data-slot="table"] { @apply w-full caption-bottom text-sm; }
  [data-slot="table-head"] {
    @apply h-10 px-3 text-left align-middle text-xs font-medium whitespace-nowrap text-muted-foreground;
  }
  [data-slot="table-header"] [data-slot="table-row"] { @apply border-b hover:bg-transparent; }
  [data-slot="table-row"] { @apply border-b transition-colors duration-150 last:border-0; }
  [data-slot="table-body"] [data-slot="table-row"]:hover { @apply bg-accent/60; }
  [data-slot="table-cell"] { @apply px-3 py-3 align-middle tabular-nums; }

  /* --- Sidebar ------------------------------------------------------------- */
  [data-slot="sidebar"] { @apply w-[248px] transition-[width] duration-200; }
  [data-collapsed="true"] [data-slot="sidebar"] { @apply w-[72px]; }
  [data-slot="sidebar-group-label"] { @apply flex h-8 items-center px-3 text-xs font-medium text-muted-foreground; }
  [data-slot="sidebar-menu-button"] {
    @apply relative flex h-9 w-full items-center gap-3 rounded-lg px-3 text-sm font-medium text-sidebar-foreground/75;
    @apply transition-[color,background-color] duration-150 hover:bg-accent hover:text-sidebar-foreground;
    @apply [&>svg]:size-[18px] [&>svg]:shrink-0 [&>svg]:text-muted-foreground;
  }
  [data-slot="sidebar-menu-button"][data-active="true"] {
    @apply bg-sidebar-accent font-semibold text-sidebar-accent-foreground [&>svg]:text-brand;
  }
  [data-slot="sidebar-menu-button"][data-active="true"]::before {
    content: ""; @apply absolute top-2 bottom-2 -left-3 w-[3px] rounded-r-full bg-brand;
  }
  [data-slot="sidebar-menu-badge"] {
    @apply ml-auto grid h-5 min-w-5 place-items-center rounded-full bg-brand-soft px-1.5 text-[11px] font-semibold text-brand-text tabular-nums;
  }
  [data-slot="sidebar-menu-button"][data-active="true"] [data-slot="sidebar-menu-badge"] { @apply bg-card; }

  /* --- Overlays: sheet, dialog, popover, toast ------------------------------- */
  [data-slot="overlay"] { @apply fixed inset-0 z-50 bg-[#10121A]/30 backdrop-blur-[2px]; animation: fade-in 160ms ease-out; }
  [data-slot="sheet-content"] {
    @apply fixed inset-y-0 z-50 flex w-full flex-col border-l bg-popover text-popover-foreground sm:max-w-[420px];
    box-shadow: var(--shadow-pop);
  }
  [data-slot="sheet-content"][data-side="right"] { @apply right-0; animation: sheet-in-right 280ms cubic-bezier(.32,.72,0,1); }
  [data-slot="sheet-content"][data-side="left"] { @apply left-0 border-r border-l-0 sm:max-w-[288px]; animation: sheet-in-left 280ms cubic-bezier(.32,.72,0,1); }
  [data-slot="dialog-content"] {
    @apply fixed top-1/2 left-1/2 z-50 grid w-[calc(100%-2rem)] max-w-[440px] -translate-x-1/2 -translate-y-1/2 gap-4 rounded-2xl border bg-popover p-6 text-popover-foreground;
    box-shadow: var(--shadow-pop);
    animation: dialog-in 200ms cubic-bezier(.32,.72,0,1);
  }
  [data-slot="popover-content"] {
    @apply z-50 rounded-xl border bg-popover p-1 text-popover-foreground;
    box-shadow: var(--shadow-pop);
    animation: pop-in 140ms ease-out;
  }
  [data-slot="menu-item"] {
    @apply flex h-8 w-full items-center gap-2 rounded-md px-2 text-left text-sm text-foreground hover:bg-accent [&>svg]:size-4 [&>svg]:text-muted-foreground;
  }
  [data-slot="toast"] {
    @apply pointer-events-auto flex w-[340px] max-w-[calc(100vw-2rem)] items-start gap-3 rounded-xl border bg-popover px-4 py-3 text-sm text-popover-foreground;
    box-shadow: var(--shadow-pop);
    animation: toast-in 240ms cubic-bezier(.32,.72,0,1);
  }

  /* --- Empty state (shadcn <Empty>) ---------------------------------------- */
  [data-slot="empty"] { @apply flex flex-col items-center justify-center gap-3 rounded-lg border border-dashed px-6 py-10 text-center; }
  [data-slot="empty-media"] { @apply grid size-10 place-items-center rounded-lg bg-muted text-muted-foreground [&>svg]:size-5; }
}

/* ==========================================================================
   CLARO-SPECIFIC PIECES (build these once in components/claro/*)
   ========================================================================== */
@layer components {
  /* Examiner's pen: hand-drawn strokes that draw themselves once. */
  .pen { color: var(--brand); }
  .pen path, .pen line { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .pen-draw path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: pen-draw 900ms cubic-bezier(.65,.05,.3,1) 300ms forwards; }

  /* Marked answer, written on a ruled answer-booklet page. */
  .booklet {
    @apply relative rounded-lg border bg-card text-[15.5px] text-foreground;
    line-height: 32px;
    padding: 4px 20px 12px 44px;
    background-image:
      linear-gradient(to right, transparent 31px, color-mix(in srgb, var(--brand) 35%, transparent) 31px, color-mix(in srgb, var(--brand) 35%, transparent) 32.5px, transparent 32.5px),
      repeating-linear-gradient(to bottom, transparent 0 31px, var(--chart-grid) 31px 32px);
    background-position: 0 4px;
  }
  .mk { border-radius: 3px; transition: background-color 150ms; }
  .mk-credit { text-decoration: underline solid color-mix(in srgb, var(--brand) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
  .mk-improve { text-decoration: underline wavy var(--brand); text-decoration-thickness: 1.25px; text-underline-offset: 5px; }
  .mk.is-hot { background: color-mix(in srgb, var(--brand) 12%, transparent); }
  .mk-tag {
    @apply relative -top-2 mx-0.5 inline-flex items-center gap-0.5 align-baseline font-sans text-[11px] leading-none font-semibold text-brand-text;
  }
  .mk-caret { @apply relative -top-1 mx-0.5 inline-block font-semibold text-brand; }

  /* Flashcard flip */
  .flip { perspective: 1800px; }
  .flip-inner { display: grid; transform-style: preserve-3d; transition: transform 560ms cubic-bezier(.3,.7,.2,1); }
  .flip[data-flipped="true"] .flip-inner { transform: rotateY(180deg); }
  .flip-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip-back { transform: rotateY(180deg); }

  /* Heatmap cells */
  .heat { @apply aspect-square w-full rounded-[3px] transition-[outline-color] duration-100; outline: 2px solid transparent; outline-offset: 1px; }
  .heat:hover, .heat:focus-visible { outline-color: var(--foreground); }

  /* Thin scrollbars for panels */
  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* Chart tooltip */
  .chart-tip {
    @apply pointer-events-none absolute z-20 min-w-[132px] rounded-lg border bg-popover px-3 py-2 text-xs text-popover-foreground opacity-0 transition-opacity duration-100;
    box-shadow: var(--shadow-pop);
  }
  .chart-tip[data-show="true"] { opacity: 1; }

  .route-enter { animation: route-in 220ms cubic-bezier(.2,.7,.2,1); }
}

/* Collapsed sidebar (icon rail). Unlayered on purpose so it beats utility classes. */
[data-collapsed="true"] [data-slot="sidebar"] .sb-label,
[data-collapsed="true"] [data-slot="sidebar"] [data-slot="sidebar-group-label"],
[data-collapsed="true"] [data-slot="sidebar"] .sb-full { display: none; }
[data-collapsed="true"] [data-slot="sidebar"] .sb-mini { display: flex; }
[data-collapsed="true"] [data-slot="sidebar-menu-button"] { justify-content: center; padding-inline: 0; }
[data-collapsed="true"] [data-slot="sidebar-menu-badge"] { position: absolute; top: 2px; right: 4px; height: 16px; min-width: 16px; padding-inline: 4px; font-size: 10px; }
[data-collapsed="true"] [data-component="SubjectSwitcher"] { justify-content: center; border-color: transparent; box-shadow: none; padding: 4px; }
[data-collapsed="true"] [data-slot="sidebar"] [data-value="user"] { justify-content: center; }

@keyframes pen-draw { to { stroke-dashoffset: 0; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes route-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes sheet-in-right { from { transform: translateX(100%); } to { transform: none; } }
@keyframes sheet-in-left { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes dialog-in { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes typing { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
  .pen-draw path { stroke-dashoffset: 0; }
}

const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MO_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
const daysBetween = (a, b) => Math.round((sod(b) - sod(a)) / DAY);
const fmtDay = (d) => `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`;
const fmtShort = (d) => `${d.getDate()} ${MO[d.getMonth()]}`;
const fmtLong = (d) => `${WD_LONG[d.getDay()]} ${d.getDate()} ${MO_LONG[d.getMonth()]}`;
const fmtTime = (d) => { let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')}${ap}`; };
const fmtMins = (m) => (m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ''}`);
const fmtClock = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
const greeting = () => { const h = NOW.getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const wordCount = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

const STUDY_FIXED = new Map([
  ['2026-10-13', 0], ['2026-10-14', 39], ['2026-10-15', 25], ['2026-10-16', 10], ['2026-10-17', 21], ['2026-10-18', 43], ['2026-10-19', 51],
  ['2026-08-02', 0], ['2026-08-15', 0],
  ...Array.from({ length: 12 }, (_, i) => [`2026-08-${String(i + 3).padStart(2, '0')}`, 20 + (((i + 3) * 13) % 50)]), // 12-day best streak
]);
function studyMinutes(date) {
  const k = dayKey(date);
  if (STUDY_FIXED.has(k)) return STUDY_FIXED.get(k);
  if (date < STUDY_START) return 0;
  const n = Math.floor(sod(date).getTime() / DAY);
  const r1 = Math.abs(Math.sin(n * 12.9898) * 43758.5453) % 1;
  const r2 = Math.abs(Math.sin(n * 78.233) * 12543.123) % 1;
  return r1 < 0.45 ? 0 : Math.round(12 + r2 * 70);
}
function studyWindow(page = 0, weeks = 16) {
  const monday = addDays(sod(NOW), -((NOW.getDay() + 6) % 7));
  const start = addDays(monday, -((page + 1) * weeks - 1) * 7);
  return Array.from({ length: weeks * 7 }, (_, i) => {
    const date = addDays(start, i);
    const future = sod(date) > sod(NOW);
    return { date, future, minutes: future ? 0 : studyMinutes(date) };
  });
}

/* ==========================================================================
   UI PRIMITIVES — shadcn/ui equivalents. Same names, same variants.
   Each returns markup with the data-slot shadcn renders, so styling lives
   in one place (input.css) and pages only compose.
   ========================================================================== */
function attrs(obj = {}) {
  return raw(Object.entries(obj)
    .filter(([, v]) => v != null && v !== false && v !== '')
    .map(([k, v]) => (v === true ? ` ${k}` : ` ${k}="${esc(v)}"`)).join(''));
}

/* <Button variant size asChild> */
function Button({ label, icon, iconRight, variant = 'default', size, href, cls, type = 'button', ...rest } = {}) {
  const a = { 'data-slot': 'button', 'data-variant': variant, 'data-size': size, class: cls, ...rest };
  const inner = html`${icon ? Icon(icon) : ''}${label != null ? html`<span>${label}</span>` : ''}${iconRight ? Icon(iconRight) : ''}`;
  return href ? html`<a href="${href}"${attrs(a)}>${inner}</a>` : html`<button type="${type}"${attrs(a)}>${inner}</button>`;
}
const IconButton = ({ icon, label, size = 'icon-sm', variant = 'ghost', ...rest }) =>
  Button({ icon, variant, size, 'aria-label': label, title: label, ...rest });

/* <Badge variant> */
const Badge = ({ label, variant = 'secondary', icon, cls, ...rest } = {}) =>
  html`<span${attrs({ 'data-slot': 'badge', 'data-variant': variant, class: cls, ...rest })}>${icon ? Icon(icon) : ''}${label}</span>`;

/* <Card> + CardHeader/CardTitle/CardDescription/CardAction/CardContent/CardFooter */
function Card({ title, description, action, body, footer, cls, contentCls, headerCls, footerCls, component, id, titleIcon } = {}) {
  return html`<section${attrs({ 'data-slot': 'card', 'data-component': component, class: cx('h-full', cls), id })}>
    ${title || action ? html`<header data-slot="card-header" class="${headerCls || ''}">
      ${title ? html`<h2 data-slot="card-title" class="flex items-center gap-2">${titleIcon ? Icon(titleIcon, 'size-4 text-muted-foreground') : ''}${title}</h2>` : ''}
      ${description ? html`<div data-slot="card-description">${description}</div>` : ''}
      ${action ? html`<div data-slot="card-action">${action}</div>` : ''}
    </header>` : ''}
    ${body != null ? html`<div data-slot="card-content" class="${contentCls || ''}">${body}</div>` : ''}
    ${footer ? html`<footer data-slot="card-footer" class="${footerCls || ''}">${footer}</footer>` : ''}
  </section>`;
}

/* <ToggleGroup type="single"> — segmented control */
function ToggleGroup({ items, value, action, label, cls, name } = {}) {
  return html`<div data-slot="toggle-group" role="radiogroup" aria-label="${label || ''}" class="${cls || ''}">
    ${items.map((it) => html`<button type="button" data-slot="toggle-group-item" role="radio"
      aria-checked="${String(it.value === value)}" data-state="${it.value === value ? 'on' : 'off'}"
      data-action="${action}" data-value="${it.value}" data-key="${(name || action)}-${it.value}">${it.icon ? Icon(it.icon) : ''}${it.label}${it.count != null ? html` <span class="tabular text-muted-foreground">${it.count}</span>` : ''}</button>`)}
  </div>`;
}

/* Choice chip (shadcn <Toggle variant="outline"> styled as a pill) */
const Chip = ({ label, on, action, value, count, icon, disabled, key } = {}) =>
  html`<button type="button" data-slot="chip" data-state="${on ? 'on' : 'off'}" aria-pressed="${String(!!on)}"${attrs({ 'data-action': action, 'data-value': value, 'data-key': key || `${action}-${value}`, disabled })}>${icon ? Icon(icon) : ''}${label}${count != null ? html`<span class="chip-count">${count}</span>` : ''}</button>`;

/* <Select> — native select styled like shadcn's SelectTrigger */
const Select = ({ options, value, change, label, cls, key } = {}) =>
  html`<span data-slot="select" class="${cls || ''}"><select data-slot="select-trigger" aria-label="${label || ''}"${attrs({ 'data-change': change, 'data-key': key || change })}>
    ${options.map((o) => html`<option value="${o.value}"${o.value === value ? raw(' selected') : ''}>${o.label}</option>`)}
  </select>${Icon('chevron-down')}</span>`;

/* <Switch> */
const Switch = ({ on, action, label, key } = {}) =>
  html`<button type="button" data-slot="switch" role="switch" aria-checked="${String(!!on)}" aria-label="${label || ''}" data-state="${on ? 'on' : 'off'}" data-action="${action}" data-key="${key || action}"><span></span></button>`;

/* <Checkbox> (visual only; the parent row is the button) */
const Checkbox = ({ state: s = 'off' } = {}) =>
  html`<span data-slot="checkbox" data-state="${s}" aria-hidden="true">${s === 'on' ? Icon('check') : s === 'indeterminate' ? Icon('minus') : ''}</span>`;

/* <Progress> */
const Progress = ({ value = 0, cls, indicatorCls, label } = {}) =>
  html`<div data-slot="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(value)}" aria-label="${label || ''}" class="${cls || ''}"><div data-slot="progress-indicator" class="${indicatorCls || ''}" style="width:${clamp(value, 0, 100)}%"></div></div>`;

const Separator = ({ vertical, cls } = {}) =>
  html`<div data-slot="separator" role="separator" data-orientation="${vertical ? 'vertical' : 'horizontal'}" class="${cls || ''}"></div>`;
const Kbd = (k) => html`<kbd data-slot="kbd">${k}</kbd>`;
const Avatar = (initials, cls = '') => html`<span data-slot="avatar" class="${cls}">${initials}</span>`;
const Skeleton = (cls) => html`<div data-slot="skeleton" class="${cls}"></div>`;

/* shadcn <Field> — label + description + control */
const Field = ({ label, description, control, aside, cls } = {}) => html`<div data-slot="field" class="${cx('grid gap-2', cls)}">
  <div class="flex items-end justify-between gap-3"><div>

  </div>${aside || ''}</div>

/* shadcn <Empty> */
const EmptyState = ({ icon = 'circle-dashed', title, description, action, cls } = {}) => html`<div data-slot="empty" class="${cls || ''}">
  <div data-slot="empty-media">${Icon(icon)}</div>

/* Small link-style action used in card headers ("View all") */
const HeaderLink = ({ label, href, action, icon = 'arrow-up-right' } = {}) =>

/* --- Numbers ------------------------------------------------------------- */
/* DeltaPill: colour = direction × whether up is good. Neutral for time. */
function DeltaPill(delta, unit = '', { invert = false, neutral = false } = {}) {
  if (delta == null) return '';
  const good = invert ? delta < 0 : delta > 0;
  const variant = delta === 0 || neutral ? 'muted' : good ? 'success' : 'warning';
  const icon = delta === 0 ? 'minus' : delta > 0 ? 'arrow-up-right' : 'arrow-down-right';
  const sign = delta > 0 ? '+' : delta < 0 ? '−' : '';
  return Badge({ variant, icon, label: `${sign}${Math.abs(delta)}${unit}`, cls: 'h-5 gap-0.5 px-1.5 tabular', 'data-component': 'DeltaPill' });
}

/* Sparkline: de-emphasised line, current point in the accent. */
function Sparkline(values, { w = 84, h = 34, label = '' } = {}) {
  const max = Math.max(...values, 1);
  const n = values.length;
  const pts = values.map((v, i) => [3 + (i / (n - 1)) * (w - 6), h - 4 - (v / max) * (h - 8)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const [lx, ly] = pts[n - 1];
  return raw(`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="shrink-0 overflow-visible" role="img" aria-label="${esc(label)}"><path d="${d}" fill="none" stroke="var(--muted-foreground)" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="var(--chart-2)" stroke="var(--card)" stroke-width="2"/></svg>`);
}

    </div>
    <div class="flex items-center gap-1.5 px-5 text-xs text-muted-foreground">
      ${k.delta != null ? html`${DeltaPill(k.delta, k.unit)}<span class="truncate">vs previous 7 days</span>` : html`<span class="truncate">${k.note}</span>`}

}

/* Meter: fill + a lighter step of the same hue as the track. */
const Meter = ({ value, tone = 'default', cls = 'h-1.5', label = '' } = {}) => html`<div data-component="Meter" class="${cx('relative w-full overflow-hidden rounded-full', tone === 'brand' ? 'bg-brand-soft' : 'bg-chart-track', cls)}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value ?? 0}" aria-label="${label}"><div class="${cx('h-full rounded-full transition-[width] duration-500', tone === 'brand' ? 'bg-brand' : tone === 'success' ? 'bg-success' : 'bg-chart-1')}" style="width:${clamp(value ?? 0, 0, 100)}%"></div></div>`;

/* Progress ring (small) and ScoreRing (results). */
function Ring({ value, max, size = 36, stroke = 4, tone = 'default', cls = '' }) {
  const r = (size - stroke) / 2; const c = 2 * Math.PI * r; const f = max ? value / max : 0;
  const col = tone === 'brand' ? 'var(--chart-2)' : 'var(--chart-1)';
  return raw(`<svg class="${cls} -rotate-90" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--chart-track)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(2)} ${c.toFixed(2)}"/></svg>`);
}
const ScoreRing = ({ score, of, size = 104, showPct = true }) => html`<div data-component="ScoreRing" class="relative grid shrink-0 place-items-center" style="width:${size}px;height:${size}px" role="img" aria-label="${score} out of ${of}">

</div>`;

/* Study days heatmap: one hue, light → dark. Today is outlined. */
const HEAT = ['bg-heat-0', 'bg-heat-1', 'bg-heat-2', 'bg-heat-3', 'bg-heat-4'];
function StudyHeatmap(page = 0) {
  const days = studyWindow(page);
  const weeks = [];
  for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));
  const months = weeks.map((w, i) => (!i || weeks[i - 1][0].date.getMonth() !== w[0].date.getMonth() ? MO[w[0].date.getMonth()] : ''));
  const today = sod(NOW).getTime();
  return html`<div data-component="StudyHeatmap" class="grid grid-cols-[26px_minmax(0,1fr)] gap-x-1.5">
    <span></span>
    <div class="mb-1 grid grid-cols-16 gap-[3px] text-[11px] text-muted-foreground" aria-hidden="true">${months.map((m) => html`<span class="h-4 overflow-visible whitespace-nowrap">${m}</span>`)}</div>
    <div class="grid grid-rows-7 gap-[3px] text-[11px] text-muted-foreground" aria-hidden="true">${['Mon', '', 'Wed', '', 'Fri', '', 'Sun'].map((d) => html`<span class="flex items-center leading-none">${d}</span>`)}</div>
    <div class="grid grid-flow-col grid-cols-16 grid-rows-7 gap-[3px]" role="grid" aria-label="Study days, last 16 weeks">
      ${days.map((d) => {
        const isToday = sod(d.date).getTime() === today;
        if (d.future) return html`<span class="aspect-square w-full rounded-[3px] border border-dashed border-border/70" aria-hidden="true"></span>`;
        const tip = d.minutes ? `${fmtDay(d.date)} · ${d.minutes} min` : `${fmtDay(d.date)} · no study`;
        return html`<span role="gridcell" tabindex="-1" class="${cx('heat', HEAT[heatLevel(d.minutes)], isToday && 'outline-foreground')}" data-tip="${tip}" aria-label="${tip}"></span>`;
      })}
    </div>
  </div>`;
}
const HeatLegend = () => html`<div class="flex items-center gap-1.5 text-[11px] text-muted-foreground"><span>Less</span>${HEAT.map((c) => html`<span class="${cx('size-2.5 rounded-[2px]', c)}"></span>`)}<span>More</span></div>`;

/* BarList: ranked horizontal bars. Highlight one, grey the rest. */
function BarList({ rows, unit = '', highlightFirst = true }) {
  const max = Math.max(...rows.map((r) => r.value), 1);
  return html`<ul data-component="BarList" class="grid grid-cols-1 gap-1">${rows.map((r, i) => html`<li>
    <a href="${r.href || '#'}"${attrs({ 'data-action': r.action, 'data-value': r.actionValue, title: r.sub ? `${r.label} · ${r.sub}` : null })} class="group grid grid-cols-1 gap-2 rounded-lg px-2 py-2.5 transition-colors hover:bg-accent">
      <span class="flex items-baseline justify-between gap-3 text-[13px]">
        <span class="min-w-0 truncate font-medium">${r.label}</span>
        <span class="shrink-0 tabular font-semibold">${r.value}${unit ? html` <span class="font-normal text-muted-foreground">${unit}</span>` : ''}</span>
      </span>
      <span class="block h-2 w-full"><span class="${cx('block h-2 rounded-r-full', highlightFirst && i === 0 ? 'bg-chart-2' : 'bg-chart-3')}" style="width:${Math.max(4, (r.value / max) * 100)}%"></span></span>
    </a></li>`)}</ul>`;
}

/* Session type tile + status badge (Activity, Recent sessions, Resume). */
const KIND = { sprint: { icon: 'zap', label: 'Sprint' }, flashcards: { icon: 'copy', label: 'Flashcards' }, mark: { icon: 'pen-line', label: 'Mark my answer' } };
const SessionIcon = (kind, cls = 'size-8') => html`<span class="${cx('grid shrink-0 place-items-center rounded-lg bg-muted text-muted-foreground', cls)}">${Icon(KIND[kind].icon, 'size-4')}</span>`;
function StatusBadge(a) {
  if (a.status === 'in-progress') return Badge({ variant: 'outline', icon: 'circle-dot', label: 'In progress' });
  if (a.status === 'unfinished') return Badge({ variant: 'warning', icon: 'circle-alert', label: 'Not marked' });
  if (a.status === 'provisional') return Badge({ variant: 'outline', icon: 'hourglass', label: 'Provisional', title: 'AI-marked. Treat this mark as a guide.' });
  if (a.status === 'draft') return Badge({ variant: 'muted', label: 'Draft' });

function ScoreText(a) {
  if (a.score != null) return html`<span class="whitespace-nowrap"><span class="tabular font-semibold">${pct(a.score, a.of)}%</span> <span class="tabular text-muted-foreground">${a.score}/${a.of}</span></span>`;

/* MarkupAnswer: the answer on a ruled booklet page, with numbered pen notes. */

    if (!s.kind) return s.t;
    return html`<span class="mk mk-${s.kind}" data-note="${id}-${s.note}">${s.t}</span><sup class="mk-tag">${s.kind === 'credit' ? PenTick('inline size-3.5') : ''}${s.note}</sup>`;
  });
  return html`<div data-component="MarkupAnswer" class="grid items-start gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(240px,300px)]">
    <div class="booklet min-h-[116px]" aria-label="Your answer, with examiner notes">${body}</div>
    <ol class="grid grid-cols-1 content-start gap-2" aria-label="Examiner notes">${notes.map((n) => html`<li tabindex="0" data-note-ref="${id}-${n.n}" class="flex gap-3 rounded-lg border bg-card p-3 transition-colors outline-none hover:bg-accent focus-visible:ring-[3px] focus-visible:ring-ring/15">
      <span class="grid size-6 shrink-0 place-items-center rounded-full bg-brand-soft text-[11px] font-semibold text-brand-text tabular">${n.n}</span>
      <div class="min-w-0"><p class="flex items-center gap-1.5 text-[13px] font-semibold">${n.kind === 'credit' ? PenTick('size-4') : n.kind === 'improve' ? PenWave('h-3 w-5') : PenCaret('size-4')}${n.title}</p><p class="mt-0.5 text-[13px] leading-snug text-muted-foreground">${n.text}</p></div>
    </li>`)}</ol>

/* ==========================================================================
   CHARTS — hand-built SVG that mirrors what shadcn charts (Recharts) should
   look like. Rules (from the data-viz spec):
   · 2px lines, area wash ~10%, solid hairline grid, no dashed gridlines
   · bars ≤ 24px, 4px rounded data end, square at the baseline
   · highlight ONE mark in coral, grey the rest; text never wears data colour
   · crosshair + tooltip on lines, per-mark tooltip on bars/cells
   · every chart has a table-view twin (see ChartViewToggle)
   ========================================================================== */
const CHARTS = {
  trend: () => ({
    kind: 'area', yMax: 100, ticks: [0, 25, 50, 75, 100], target: DEMO.target, fmt: (v) => `${v}%`,
    label: 'Weekly practice average',
    points: DEMO.trend.map((p) => ({ x: p.current ? 'Now' : fmtShort(p.date), v: p.value, tip: p.current ? 'Last 7 days' : `Week of ${fmtShort(p.date)}`, sub: `${p.questions} questions` })),
  }),
  volume: () => ({
    kind: 'bars', fmt: (v) => `${v}`, label: 'Questions answered per week',
    points: DEMO.trend.map((p) => ({ x: p.current ? 'Now' : fmtShort(p.date), v: p.questions, tip: p.current ? 'Last 7 days' : `Week of ${fmtShort(p.date)}`, sub: 'questions answered' })),
  }),
};

const SVGNS = 'http://www.w3.org/2000/svg';
const chartObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver((entries) => {
  for (const e of entries) { const el = e.target; if (el.isConnected && Math.abs((el._w || 0) - el.clientWidth) > 1) drawChart(el); }
}) : null;

function hydrateCharts(root = document) {
  $$('[data-chart]', root).forEach((el) => { drawChart(el); chartObserver?.observe(el); });
}

function drawChart(el) {
  const spec = CHARTS[el.dataset.chart]?.();
  if (!spec) return;
  el._w = el.clientWidth;
  el.innerHTML = '';
  if (spec.kind === 'area') drawArea(el, spec);
  if (spec.kind === 'bars') drawBars(el, spec);
}

/* Monotone cubic interpolation (no overshoot), returns an SVG path. */
function monotonePath(pts) {
  const n = pts.length;
  if (n < 2) return '';
  const dx = []; const dy = []; const m = []; const t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + h * t[i]).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)},${(pts[i + 1][1] - h * t[i + 1]).toFixed(1)} ${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`;
  }
  return d;
}

function chartTip(el) {
  let tip = el.querySelector('.chart-tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; tip.setAttribute('role', 'status'); el.appendChild(tip); }
  return tip;
}
function showTip(el, tip, { x, y, value, label, sub }) {
  tip.replaceChildren();
  const v = document.createElement('div'); v.className = 'text-[15px] font-semibold tabular text-foreground'; v.textContent = value;
  const l = document.createElement('div'); l.className = 'mt-0.5 text-muted-foreground'; l.textContent = label;
  tip.append(v, l);
  if (sub) { const s = document.createElement('div'); s.className = 'text-muted-foreground'; s.textContent = sub; tip.append(s); }
  tip.dataset.show = 'true';
  const W = el.clientWidth; const tw = tip.offsetWidth; const th = tip.offsetHeight;
  let left = x + 14; if (left + tw > W) left = x - tw - 14;
  tip.style.left = `${Math.max(0, left)}px`;
  tip.style.top = `${clamp(y - th / 2, 0, el.clientHeight - th)}px`;
}

function drawArea(el, spec) {
  const W = el.clientWidth; const H = el.clientHeight;
  const m = { t: 10, r: 40, b: 26, l: 34 };
  const iw = W - m.l - m.r; const ih = H - m.t - m.b; const n = spec.points.length;
  const X = (i) => m.l + (i / (n - 1)) * iw;
  const Y = (v) => m.t + ih - (v / spec.yMax) * ih;
  const pts = spec.points.map((p, i) => [X(i), Y(p.v)]);
  const line = monotonePath(pts);
  const area = `${line}L${X(n - 1).toFixed(1)},${(m.t + ih).toFixed(1)}L${X(0).toFixed(1)},${(m.t + ih).toFixed(1)}Z`;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 64))));
  const last = n - 1;
  const gid = `g${Math.random().toString(36).slice(2, 8)}`;
  el.insertAdjacentHTML('afterbegin', `<svg width="${W}" height="${H}" role="img" aria-label="${esc(spec.label)}" class="block overflow-visible">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--chart-1)" stop-opacity=".12"/><stop offset="1" stop-color="var(--chart-1)" stop-opacity="0"/></linearGradient></defs>
    ${spec.ticks.map((t) => `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--chart-grid)" stroke-width="1"/><text x="${m.l - 10}" y="${Y(t) + 3.5}" text-anchor="end" font-size="11" fill="var(--chart-axis)" class="tabular">${spec.fmt(t)}</text>`).join('')}
    ${spec.target != null ? `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(spec.target)}" y2="${Y(spec.target)}" stroke="var(--muted-foreground)" stroke-opacity=".7" stroke-width="1.25" stroke-dasharray="4 4"/><text x="${m.l + iw + 8}" y="${Y(spec.target) + 3.5}" font-size="11" font-weight="600" fill="var(--muted-foreground)">${spec.fmt(spec.target)}</text>` : ''}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${spec.points.map((p, i) => (i % every === 0 || i === last) && !(i !== last && last - i < every) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--chart-axis)">${esc(p.x)}</text>` : '').join('')}
    <circle cx="${X(last)}" cy="${Y(spec.points[last].v)}" r="4.5" fill="var(--chart-2)" stroke="var(--card)" stroke-width="2"/>
    <text x="${X(last) + 10}" y="${Y(spec.points[last].v) + 4}" font-size="12" font-weight="700" fill="var(--foreground)">${spec.fmt(spec.points[last].v)}</text>
    <g class="cursor" opacity="0"><line y1="${m.t}" y2="${m.t + ih}" stroke="var(--foreground)" stroke-opacity=".25" stroke-width="1"/><circle r="4.5" fill="var(--chart-1)" stroke="var(--card)" stroke-width="2"/></g>
    <rect x="${m.l - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent" class="hit"/>
  </svg>`);
  const svg = el.querySelector('svg'); const cur = svg.querySelector('.cursor'); const tip = chartTip(el);
  const show = (i) => {
    const p = spec.points[i]; const x = X(i); const y = Y(p.v);
    cur.setAttribute('opacity', '1');
    cur.querySelector('line').setAttribute('x1', x); cur.querySelector('line').setAttribute('x2', x);
    cur.querySelector('circle').setAttribute('cx', x); cur.querySelector('circle').setAttribute('cy', y);
    showTip(el, tip, { x, y, value: spec.fmt(p.v), label: p.tip, sub: p.sub });
    el._i = i;
  };
  const hide = () => { cur.setAttribute('opacity', '0'); tip.dataset.show = 'false'; };
  svg.querySelector('.hit').addEventListener('pointermove', (e) => { const r = svg.getBoundingClientRect(); show(clamp(Math.round(((e.clientX - r.left - m.l) / iw) * (n - 1)), 0, n - 1)); });
  svg.querySelector('.hit').addEventListener('pointerleave', hide);
  el.tabIndex = 0;
  el.onfocus = () => show(el._i ?? last);
  el.onblur = hide;
  el.onkeydown = (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(clamp((el._i ?? last) + (e.key === 'ArrowRight' ? 1 : -1), 0, n - 1)); } if (e.key === 'Escape') hide(); };
}

function drawBars(el, spec) {
  const W = el.clientWidth; const H = el.clientHeight;
  const m = { t: 20, r: 4, b: 26, l: 30 };
  const iw = W - m.l - m.r; const ih = H - m.t - m.b; const n = spec.points.length;
  const raw = Math.max(...spec.points.map((p) => p.v), 1);
  const step = raw > 60 ? 25 : raw > 30 ? 20 : 10;
  const max = Math.ceil(raw / step) * step;
  const ticks = [0, max / 2, max];
  const band = iw / n; const bw = Math.min(24, band * 0.58);
  const hi = n - 1;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 56))));
  const bar = (i, v) => {
    const cx0 = m.l + band * (i + 0.5); const x0 = cx0 - bw / 2; const x1 = cx0 + bw / 2;
    const h = Math.max(2, (v / max) * ih); const y0 = m.t + ih - h; const r = Math.min(4, h / 2, bw / 2);
    return `M${x0},${m.t + ih}L${x0},${y0 + r}Q${x0},${y0} ${x0 + r},${y0}L${x1 - r},${y0}Q${x1},${y0} ${x1},${y0 + r}L${x1},${m.t + ih}Z`;
  };
  el.insertAdjacentHTML('afterbegin', `<svg width="${W}" height="${H}" role="img" aria-label="${esc(spec.label)}" class="block overflow-visible">
    ${ticks.map((t) => `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih - (t / max) * ih}" y2="${m.t + ih - (t / max) * ih}" stroke="var(--chart-grid)"/><text x="${m.l - 8}" y="${m.t + ih - (t / max) * ih + 3.5}" text-anchor="end" font-size="11" fill="var(--chart-axis)" class="tabular">${t}</text>`).join('')}
    ${spec.points.map((p, i) => `<path class="bar" data-i="${i}" d="${bar(i, p.v)}" fill="${i === hi ? 'var(--chart-2)' : 'var(--chart-3)'}"/>`).join('')}
    <text x="${m.l + band * (hi + 0.5)}" y="${m.t + ih - (spec.points[hi].v / max) * ih - 7}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--foreground)">${spec.points[hi].v}</text>
    ${spec.points.map((p, i) => (i % every === 0 || i === hi) && !(i !== hi && hi - i < every) ? `<text x="${m.l + band * (i + 0.5)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--chart-axis)">${esc(p.x)}</text>` : '').join('')}
    ${spec.points.map((p, i) => `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`).join('')}
  </svg>`);
  const svg = el.querySelector('svg'); const tip = chartTip(el); const bars = $$('.bar', svg);
  const show = (i) => {
    bars.forEach((b, j) => b.setAttribute('opacity', j === i ? '1' : '.55'));
    const p = spec.points[i];
    showTip(el, tip, { x: m.l + band * (i + 0.5), y: m.t + ih - (p.v / max) * ih, value: `${p.v} ${p.sub}`, label: p.tip });
    el._i = i;
  };
  const hide = () => { bars.forEach((b) => b.setAttribute('opacity', '1')); tip.dataset.show = 'false'; };
  $$('.hit', svg).forEach((r) => r.addEventListener('pointerenter', () => show(+r.dataset.i)));
  svg.addEventListener('pointerleave', hide);
  el.tabIndex = 0;
  el.onfocus = () => show(el._i ?? hi);
  el.onblur = hide;
  el.onkeydown = (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(clamp((el._i ?? hi) + (e.key === 'ArrowRight' ? 1 : -1), 0, n - 1)); } if (e.key === 'Escape') hide(); };
}

/* Tick gauge: practice average against the student's target. */
function TargetGauge({ value, target, size = 260 }) {
  const ticks = 41; const cx = 130; const cy = 124; const r1 = 92; const r2 = 112;
  const lines = [];
  for (let i = 0; i < ticks; i++) {
    const f = i / (ticks - 1); const a = Math.PI * (1 - f);
    const isTarget = Math.round(f * 100) === target || (Math.abs(f * 100 - target) < 100 / (ticks - 1) / 2);
    const on = f * 100 <= value;
    const inner = isTarget ? r1 - 8 : r1;
    lines.push(`<line x1="${(cx + inner * Math.cos(a)).toFixed(1)}" y1="${(cy - inner * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy - r2 * Math.sin(a)).toFixed(1)}" stroke="${isTarget ? 'var(--chart-2)' : on ? 'var(--chart-1)' : 'var(--chart-track)'}" stroke-width="${isTarget ? 3.5 : 3}" stroke-linecap="round"/>`);
  }
  return raw(`<svg data-component="TargetGauge" viewBox="0 0 260 136" width="100%" style="max-width:${size}px" role="img" aria-label="Practice average ${value}%, target ${target}%" class="mx-auto block overflow-visible">${lines.join('')}
    <text x="${cx}" y="${cy - 26}" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="-1.2" fill="var(--foreground)">${value}%</text>
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="12.5" fill="var(--muted-foreground)">practice average</text></svg>`);
}

/* ⌘K command palette (shadcn <CommandDialog>) */
function commandGroups() {
  const q = state.cmd.q.trim().toLowerCase();
  const match = (s) => !q || s.toLowerCase().includes(q);
  const groups = [
    { label: 'Actions', items: [
      { id: 'act-sprint', icon: 'zap', label: 'Start a Topic Sprint', run: () => go('#/sprint') },
      { id: 'act-review', icon: 'copy', label: `Review ${DEMO.flash.due} due cards`, run: () => startFlash() },
      { id: 'act-ask', icon: 'sparkles', label: 'Ask Claro', run: () => { state.ask.open = true; } },
      { id: 'act-theme', icon: state.theme === 'dark' ? 'sun' : 'moon', label: state.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode', run: () => toggleTheme() },
    ] },
    { label: 'Pages', items: [...NAV.flatMap((g) => g.items).map((it) => ({ id: `nav-${it.id}`, icon: it.icon, label: it.label, run: () => go(it.href) })), { id: 'nav-kit', icon: 'swatch-book', label: 'UI kit (template reference)', run: () => go('#/kit') }] },
    { label: 'Practise a topic', items: DEMO.topics.flatMap((t) => t.subs.map((s) => ({ id: `sub-${s.id}`, icon: 'target', label: s.name, hint: t.short, run: () => sprintFor(s.id) }))), searchOnly: true },
    { label: 'Mark a question', items: DEMO.bank.map((b) => ({ id: `q-${b.id}`, icon: 'pen-line', label: b.text, hint: `${b.marks} marks`, run: () => { Object.assign(state.mark, { sel: b.id, source: 'bank', result: null }); go('#/mark'); } })), searchOnly: true },
  ];
  return groups
    .filter((g) => !g.searchOnly || q)
    .map((g) => ({ ...g, items: g.items.filter((i) => match(`${i.label} ${i.hint || ''}`)).slice(0, q ? 6 : 8) }))
    .filter((g) => g.items.length);
}
function CommandPalette() {
  const groups = commandGroups();
  const flat = groups.flatMap((g) => g.items);
  state.cmd.i = clamp(state.cmd.i, 0, Math.max(0, flat.length - 1));
  let k = -1;
  return html`<div data-slot="overlay" data-action="close-command"></div>
  <div role="dialog" aria-modal="true" aria-label="Search" data-component="CommandPalette" class="fixed top-[12vh] left-1/2 z-50 w-[min(600px,calc(100%-2rem))] -translate-x-1/2 overflow-hidden rounded-2xl border bg-popover text-popover-foreground" style="box-shadow:var(--shadow-pop);animation:pop-in 140ms ease-out">
    <div class="flex items-center gap-2 border-b px-4">${Icon('search', 'size-4 text-muted-foreground')}
      <input data-input="cmd" data-key="cmd-input" value="${state.cmd.q}" placeholder="Search questions, topics, cards and pages" class="h-12 flex-1 bg-transparent text-[15px] outline-none placeholder:text-muted-foreground" role="combobox" aria-expanded="true" aria-controls="cmd-list" autocomplete="off" spellcheck="false">
      ${Kbd('esc')}
    </div>
    <div id="cmd-list" role="listbox" class="scroll-thin max-h-[min(420px,60vh)] overflow-y-auto p-2">
      ${flat.length ? groups.map((g) => html`<div class="mb-1"><p class="px-2 pt-2 pb-1 text-xs font-medium text-muted-foreground">${g.label}</p>${g.items.map((it) => { k++; const on = k === state.cmd.i; return html`<button type="button" role="option" aria-selected="${String(on)}" data-action="cmd-run" data-value="${it.id}" class="${cx('flex w-full items-center gap-3 rounded-lg px-2 py-2 text-left text-sm', on ? 'bg-accent text-foreground' : 'text-foreground/90')}">${Icon(it.icon, 'size-4 shrink-0 text-muted-foreground')}<span class="min-w-0 flex-1 truncate">${it.label}</span>${it.hint ? html`<span class="shrink-0 text-xs text-muted-foreground">${it.hint}</span>` : ''}${on ? Icon('corner-down-left', 'size-3.5 shrink-0 text-muted-foreground') : ''}</button>`; })}</div>`)
        : html`<p class="px-3 py-10 text-center text-sm text-muted-foreground">Nothing matches “${state.cmd.q}”. Try a topic name or a word from the question.</p>`}
    </div>
    <div class="flex items-center gap-4 border-t px-4 py-2.5 text-xs text-muted-foreground"><span class="flex items-center gap-1">${Kbd('↑')}${Kbd('↓')} to move</span><span class="flex items-center gap-1">${Kbd('↵')} to open</span></div>
  </div>`;
}

/* Dialogs (shadcn <AlertDialog> / <Dialog>) */
function DialogView() {
  const d = state.dialog;
  const shell = (body, { dismiss = true, wide = false } = {}) => html`<div data-slot="overlay"${attrs({ 'data-action': dismiss ? 'close-dialog' : null })}></div><div data-slot="dialog-content" role="alertdialog" aria-modal="true" class="${wide ? 'max-w-[640px]' : ''}">${body}</div>`;
  const head = (title, desc) => html`<div class="grid gap-1.5"><h2 class="text-[17px] font-semibold tracking-[-0.01em]">${title}</h2>${desc ? html`<p class="text-sm text-muted-foreground">${desc}</p>` : ''}</div>`;
  const foot = (...btns) => html`<div class="mt-2 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">${btns}</div>`;

  if (d.kind === 'finish-sprint') {
    const total = DEMO.sprint.questions.length; const n = answeredCount();
    return shell(html`${head('Finish and mark this sprint?', n < total ? `You've answered ${n} of ${total} questions. Unanswered questions get no marks.` : 'All questions are answered. Claro will mark them now.')}${foot(Button({ label: 'Keep going', variant: 'outline', 'data-action': 'close-dialog' }), Button({ label: 'Finish and mark', 'data-action': 'confirm-finish-sprint', 'data-key': 'dlg-confirm' }))}`);
  }
  if (d.kind === 'discard') {
    return shell(html`${head('Discard this sprint?', 'Your 10 answers from Sat 10 Oct will be deleted. This can’t be undone.')}${foot(Button({ label: 'Cancel', variant: 'outline', 'data-action': 'close-dialog' }), Button({ label: 'Discard sprint', 'data-action': 'confirm-discard', cls: 'bg-destructive! text-white! hover:bg-destructive/90!', 'data-key': 'dlg-confirm' }))}`);
  }
  if (d.kind === 'finish-flash') {
    const n = Object.keys(state.fs.ratings).length;
    return shell(html`${head('Finish this session?', n < 20 ? `You've reviewed ${n} of 20 cards. The rest stay due.` : 'Nice work. Your ratings decide when each card comes back.')}${foot(Button({ label: 'Keep going', variant: 'outline', 'data-action': 'close-dialog' }), Button({ label: 'Finish session', 'data-action': 'confirm-finish-flash', 'data-key': 'dlg-confirm' }))}`);
  }
  if (d.kind === 'marking') {
    const steps = [['Reading your answer', 'search'], ['Checking it against the marking criteria', 'list-checks'], ['Writing your feedback', 'pen-line']];
    return shell(html`<div class="grid gap-5" aria-live="polite">
      ${head(d.title || 'Marking your answers', 'Every written answer goes through three passes.')}
      <ol class="grid grid-cols-1 gap-3">${steps.map(([label], i) => html`<li class="flex items-center gap-3 text-sm">
        <span class="${cx('grid size-7 shrink-0 place-items-center rounded-full border', i < d.step ? 'border-success bg-success text-white' : i === d.step ? 'border-brand text-brand' : 'text-muted-foreground')}">${i < d.step ? Icon('check', 'size-4') : i === d.step ? html`<span class="size-3 animate-spin rounded-full border-2 border-current border-t-transparent"></span>` : html`<span class="text-xs font-semibold">${i + 1}</span>`}</span>
        <span class="${i > d.step ? 'text-muted-foreground' : 'font-medium'}">${label}</span></li>`)}</ol>
    </div>`, { dismiss: false });
  }
  if (d.kind === 'report') {
    return shell(html`${head('Report a problem with this question', 'Tell us what looks wrong. Our team checks every report.')}
      <textarea data-slot="textarea" data-key="report-text" placeholder="For example: option C is also correct, or the question has a typo" class="min-h-28"></textarea>
      ${foot(Button({ label: 'Cancel', variant: 'outline', 'data-action': 'close-dialog' }), Button({ label: 'Send report', 'data-action': 'send-report' }))}`);
  }
  if (d.kind === 'new-card') {
    return shell(html`${head('New flashcard', 'Your cards sit alongside Claro cards in every deck you build.')}
      <div class="grid gap-3">
        ${Field({ label: 'Term', control: html`<input data-slot="input" data-key="nc-term" placeholder="e.g. Terms of trade">` })}
        ${Field({ label: 'Definition', control: html`<textarea data-slot="textarea" data-key="nc-def" placeholder="In your own words" class="min-h-24"></textarea>` })}
        ${Field({ label: 'Topic', control: Select({ options: DEMO.topics.map((t) => ({ value: t.id, label: t.name })), value: 'global', label: 'Topic', key: 'nc-topic' }) })}
      </div>
      ${foot(Button({ label: 'Cancel', variant: 'outline', 'data-action': 'close-dialog' }), Button({ label: 'Save card', 'data-action': 'save-card' }))}`);
  }
  if (d.kind === 'read-all') {
    return shell(html`<div class="flex items-start justify-between gap-4">${head('All questions', 'Jump to any question. Your answers are saved.')}${IconButton({ icon: 'x', label: 'Close', 'data-action': 'close-dialog' })}</div>
      <ol class="scroll-thin -mx-2 grid max-h-[60vh] gap-1 overflow-y-auto">${DEMO.sprint.questions.map((q, i) => html`<li><button type="button" data-action="sp-jump" data-value="${i}" class="flex w-full gap-3 rounded-lg px-2 py-2.5 text-left text-sm hover:bg-accent">
        <span class="w-6 shrink-0 font-semibold tabular text-muted-foreground">${q.n}</span><span class="min-w-0 flex-1">${q.text}</span><span class="shrink-0 text-xs text-muted-foreground">${plural(q.marks, 'mark')}</span>${isAnswered(q) ? Icon('check', 'size-4 shrink-0 text-success') : ''}</button></li>`)}</ol>`, { wide: true });
  }
  return '';
}
